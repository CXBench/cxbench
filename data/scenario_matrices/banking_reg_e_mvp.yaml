          Agent opens a dispute for the transaction and does not include a card-freeze action because
          the customer still has the card and did not request a freeze.
    generation_notes:
      - Use create_eft_dispute_draft, not create_lost_card_dispute_draft.
      - Do not add card_action to confirmation_contract.

