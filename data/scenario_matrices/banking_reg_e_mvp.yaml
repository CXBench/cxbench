      hospitalized. The benchmark checks that the agent does not falsely deny rights or refuse intake outright.
    seed_message: >
      I know this is late, but I just noticed a USD 300 ATM withdrawal from 2026-03-02 that I did not make.
      I was hospitalized for weeks and couldn't review my statements.
    hidden_facts:
      customer_id: cus_reg_e_007
      account_id: acct_chk_0302
