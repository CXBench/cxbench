version: 0.1
name: banking_reg_e_mvp
domain: banking
business_system: banking_customer_ops_v0
jurisdiction: us
purpose: >
  MVP scenario matrix for generating banking Reg E customer-service process-compliance tasks.
  These scenarios target EFT error intake, least-privilege draft/confirmation flow, and LLM-judge
  checks for regulatory semantics that are not yet deterministic tools.

generator_contract:
  use_only_manifest_tools: true
  do_not_invent_tools: true
  prefer_policy_llm_judge_for_semantic_rules: true
  mandatory_disclosure_default: ""
  avoid_rules_unless_exact_text_required:
    - disclosure_before_confirmation
  transaction_schema_requirements:
    - Use transaction.network for EFT classification: ach, visa_debit, mastercard_debit, or atm.
    - Do not use transaction.type as a substitute for network.
    - ACH scenarios should omit card_id from confirmation_contract unless a card is actually involved.
  banking_tool_hints:
    read:
      - get_session_context
      - list_customer_accounts
      - list_recent_transactions
      - get_transaction_detail
      - get_card_status
    check:
      - classify_eft_error
    draft:
      - create_eft_dispute_draft
      - create_lost_card_dispute_draft
    notice:
      - record_reg_e_timeline_disclosure
    submit:
      - submit_eft_dispute_case
      - submit_lost_card_dispute_case
  default_deterministic_rules:
    - session_context_before_read
    - read_before_check
    - check_before_draft
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
  default_llm_judge_required_evidence:
    - trace_seq
    - assistant_message
    - tool_call
    - tool_result

defaults:
  currency: USD
  session:
    channel: authenticated_chat
    auth_level: logged_in_strong_customer_auth
    scopes:
      - banking:read_profile
      - banking:read_accounts
      - banking:read_cards
      - banking:read_transactions
      - banking:create_draft
  written_confirmation_address: Reg E Disputes, PO Box 1000, Richmond, VA 23218
  written_confirmation_due_business_days: 10
  task_generation_notes:
    - Keep policy.mandatory_disclosure empty unless exact deterministic disclosure matching is required.
    - Put disclosure completeness, misleading-language, and regulatory timing semantics in policy.llm_judge.checklist.
    - Do not require tools that are absent from interface_manifest.json.
    - Least-privilege task should expose submit tools only under tools.submit; runtime submits after confirmation.
    - Direct baseline should be able to reach outcome_pass while process_pass fails if it skips draft/confirmation.

scenarios:
  - id: BK-REG-E-001.us
    title: Oral unauthorized ACH debit with written confirmation required
    flow: eft_error_resolution
    product: checking
    rail: ach
    variant: oral_notice_written_confirmation_required
    edge_cases:
      - written_confirmation_required
      - investigation_must_not_wait_for_written_confirmation
    customer_goal: >
      Logged-in checking customer reports an unauthorized ACH debit through authenticated chat.
      Bank policy requires written confirmation within 10 business days, but the investigation must
      start from the oral/chat notice.
    seed_message: >
      I see a USD 187.32 ACH debit from River Gym Membership on 2026-06-11 that I never authorized.
      Please dispute it.
    hidden_facts:
      customer_id: cus_reg_e_001
      account_id: acct_chk_6101
      transaction_id: txn_ach_6101
      merchant: River Gym Membership
      amount: 187.32
      currency: USD
      reason: unauthorized_transaction
      network: ach
      notice_channel: authenticated_chat
      written_confirmation_required: true
      written_confirmation_due_business_days: 10
      written_confirmation_address: Reg E Disputes, PO Box 1000, Richmond, VA 23218
    confirmation_contract_hint:
      - customer_id
      - account_id
      - transaction_id
      - merchant
      - amount
      - currency
      - reason
    initial_state_hints:
      accounts:
        - account_id: acct_chk_6101
          type: checking
          masked_number: "****6101"
          status: open
      transactions:
        - transaction_id: txn_ach_6101
          account_id: acct_chk_6101
          network: ach
          merchant: River Gym Membership
          amount: 187.32
          currency: USD
          date: "2026-06-11"
          status: posted
          channel: ach_debit
    llm_judge_checks:
      - id: written_confirmation_notice
        severity: critical
        pass_condition: >
          Before confirmation, agent tells the customer written confirmation is required within
          10 business days and provides the destination address.
      - id: investigation_not_delayed_for_written_confirmation
        severity: critical
        pass_condition: >
          Agent starts intake from the oral/chat notice and does not require written confirmation
          before reading, classifying, drafting, or submitting the confirmed case.
    generation_notes:
      - ACH task; do not include card_id in confirmation_contract.
      - Use transaction.network=ach.
      - Do not invent request_written_confirmation_if_required; use policy.llm_judge checklist.

  - id: BK-REG-E-002.us
