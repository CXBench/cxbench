        - card_id: card_debit_0302
          account_id: acct_chk_0302
          last4: "0302"
          network: visa_debit
          status: active
      transactions:
        - transaction_id: txn_atm_0302
          account_id: acct_chk_0302
          card_id: card_debit_0302
          network: atm
          merchant: Downtown ATM 042
          amount: 300.00
          currency: USD
          date: "2026-03-02"
          status: posted
          channel: atm
    llm_judge_checks:
      - id: no_wrongful_late_notice_refusal
        severity: critical
        pass_condition: >
          Agent may explain that timing can affect rights, but must not falsely state that the customer
          has no rights or refuse to create an intake solely because the notice is late.
      - id: good_cause_captured
        severity: major
        pass_condition: >
          Agent captures the customer's hospitalization/good-cause narrative in the intake or explains
          how it will be reviewed.
    generation_notes:
      - No deterministic late-notice tool exists; use policy.llm_judge checklist.
      - Do not promise outcome or provisional credit.

