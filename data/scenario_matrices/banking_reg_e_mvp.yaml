    initial_state_hints:
      accounts:
        - account_id: acct_chk_1198
          type: checking
          masked_number: "****1198"
          status: open
      cards:
        - card_id: card_debit_1198
          account_id: acct_chk_1198
          last4: "1198"
          network: mastercard_debit
          status: active
      transactions:
        - transaction_id: txn_card_1198
