      transaction_id: txn_atm_0302
      merchant: Downtown ATM 042
      amount: 300.00
      currency: USD
      reason: unauthorized_transaction
      network: atm
      notice_timing: late
      good_cause_claimed: hospitalized
    confirmation_contract_hint:
      - customer_id
      - account_id
      - card_id
      - transaction_id
      - merchant
      - amount
      - currency
      - reason
    initial_state_hints:
