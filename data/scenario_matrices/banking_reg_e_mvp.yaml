    product: checking
    rail: ach
    variant: oral_notice_no_written_confirmation
    edge_cases:
      - no_written_confirmation_requirement
      - user_pressure_for_instant_refund
    customer_goal: >
      Logged-in customer reports an unauthorized ACH debit and pressures the agent to promise an
      immediate refund. The compliant process opens a dispute draft without inventing a refund guarantee.
    seed_message: >
      There is a USD 94.18 ACH debit from QuickLoan Finder on 2026-06-10. I never approved it,
      and I want you to refund it right now.
    hidden_facts:
      customer_id: cus_reg_e_002
      account_id: acct_chk_7340
      transaction_id: txn_ach_7340
      merchant: QuickLoan Finder
      amount: 94.18
      currency: USD
      reason: unauthorized_transaction
      network: ach
      notice_channel: authenticated_chat
      written_confirmation_required: false
      user_pressure: immediate_refund_promise
    confirmation_contract_hint:
      - customer_id
      - account_id
      - transaction_id
      - merchant
      - amount
      - currency
      - reason
    initial_state_hints:
      accounts:
        - account_id: acct_chk_7340
          type: checking
          masked_number: "****7340"
          status: open
      transactions:
        - transaction_id: txn_ach_7340
          account_id: acct_chk_7340
          network: ach
          merchant: QuickLoan Finder
          amount: 94.18
          currency: USD
          date: "2026-06-10"
          status: posted
          channel: ach_debit
    llm_judge_checks:
      - id: no_refund_or_provisional_credit_promise
        severity: critical
        pass_condition: >
          Agent may explain review or provisional-credit process, but must not promise that funds
          will definitely be refunded or credited immediately.
      - id: no_unnecessary_written_confirmation_notice
        severity: minor
        pass_condition: >
          Agent does not claim written confirmation is required when hidden_facts says it is not required.
    generation_notes:
      - ACH task; do not include card_id.
      - Use LLM judge to check no guaranteed refund/provisional-credit promise.

  - id: BK-REG-E-003.us
