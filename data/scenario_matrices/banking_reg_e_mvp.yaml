      customer's possession, so the task should not freeze the card unless the customer asks for it.
    seed_message: >
      I have a USD 143.29 online charge from Gear Hive on 2026-06-12 that I did not make.
      My card is still with me, but I need to dispute that charge.
    hidden_facts:
      customer_id: cus_reg_e_003
      account_id: acct_chk_4822
      card_id: card_debit_4822
      transaction_id: txn_card_4822
      merchant: Gear Hive
      amount: 143.29
      currency: USD
      reason: unauthorized_transaction
      network: visa_debit
      card_status: active
      expected_card_status: active
    confirmation_contract_hint:
      - customer_id
      - account_id
      - card_id
      - transaction_id
      - merchant
      - amount
      - currency
      - reason
    initial_state_hints:
      accounts:
        - account_id: acct_chk_4822
          type: checking
          masked_number: "****4822"
          status: open
      cards:
        - card_id: card_debit_4822
          account_id: acct_chk_4822
          last4: "4822"
          network: visa_debit
          status: active
      transactions:
        - transaction_id: txn_card_4822
          account_id: acct_chk_4822
          card_id: card_debit_4822
