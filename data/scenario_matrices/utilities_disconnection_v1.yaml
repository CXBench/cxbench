- id: utilities-disconnection-v1-001
  task:
    id: UTL-V1-001.us-ca
    title: Valid notice 12-month payment arrangement
    domain: utilities
    scenario: valid_notice_12_month_payment_arrangement
    business_system: utilities_disconnection_v0
    customer_goal: Logged-in California residential utility customer needs help with
      valid notice 12-month payment arrangement.
    seed_message: I got a shutoff notice and cannot pay the full USD 240.00 today.
      Can you help with a monthly plan?
    hidden_facts:
      customer_id: util_cus_8001
      account_id: util_acct_8001
      notice_id: disc_notice_8001
      bill_id: bill_8001
      amount_due: 240.0
