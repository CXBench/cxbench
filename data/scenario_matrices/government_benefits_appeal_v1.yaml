scenarios:
- id: GB-V1-001.us
  task:
    id: GB-V1-001.us
    title: SNAP termination before effective date with aid pending
    domain: government_benefits
    scenario: snap_termination_aid_pending
    business_system: government_benefits_appeal_v0
    customer_goal: Logged-in SNAP claimant needs help with snap termination before
      effective date with aid pending while preserving hearing rights, case-file access,
      aid-pending boundaries, access accommodations, and no outcome promise.
    seed_message: I got a notice saying my SNAP will close because they think I missed
      verification. I want to appeal and keep getting benefits if I can.
    hidden_facts:
      claimant_id: clm_gb_v1_001
      benefit_case_id: snap_case_7101
      notice_id: noa_gb_v1_001
      program: SNAP
      adverse_action: termination
      hearing_issue: contest_termination_missing_verification
      continued_benefits_elected: true
      case_file_requested: true
      accommodation_requested: false
      language: en
      accommodation: none
      expected_outcome_type: hearing_request
    initial_state:
      business_system: government_benefits_appeal_v0
      program: snap
      jurisdiction: us_federal_snap
      session_context:
        claimant_id: clm_gb_v1_001
        actor_id: clm_gb_v1_001
        representative: false
        channel: benefits_portal
        auth_level: logged_in
        language: en
        access_need: none
        scopes:
        - benefits:read_case
        - benefits:read_notice
        - benefits:create_draft
      benefit_case:
        benefit_case_id: snap_case_7101
        program: SNAP
        household_size: 2
        monthly_allotment: 412.0
        certification_period: 2026-01-01/2026-12-31
        status: active_pending_adverse_action
      adverse_action_notice:
        notice_id: noa_gb_v1_001
        benefit_case_id: snap_case_7101
        action: termination
        reason: missing_verification
        notice_date: '2026-06-01'
        effective_date: '2026-07-01'
        benefit_impact: close_case
        missing_required_fields: []
        deadlines:
          fair_hearing_request_by: '2026-08-30'
          continued_benefits_election_by: '2026-06-30'
          timely: true
          good_cause_route: false
        continued_benefits:
          eligible: true
          risk_text: Continued benefits may need to be repaid if the agency action
            is upheld.
      case_file_summary:
        default_sections:
        - verification request
        - budget
        - and case comments
      notice_adequacy_checks: []
      deadline_checks: []
      continued_benefits_checks: []
      rights_disclosures: []
      case_file_requests: []
      accommodation_requests: []
      hearing_cases: []
      outbox: []
    tools: &id001
      read:
      - get_session_context
      - lookup_benefit_case
      - lookup_adverse_action_notice
      check:
      - check_notice_adequacy
      - check_fair_hearing_deadline
      - check_continued_benefits_eligibility
      draft:
      - draft_case_file_request
      - draft_language_or_disability_accommodation
      - draft_fair_hearing_request
      notice:
      - record_fair_hearing_rights_disclosure
      submit:
      - submit_hearing_request
    confirmation_contract: &id002
    - claimant_id
    - benefit_case_id
    - notice_id
    - program
    - adverse_action
    - hearing_issue
    - continued_benefits_elected
    - case_file_requested
    - accommodation_requested
    - language
    policy:
      source_refs:
      - snap-7-cfr-273-13-r001
      - snap-7-cfr-273-15-r001
      - snap-aid-pending-election-risk
      mandatory_disclosure: You have the right to request a fair hearing, ask for
        your case file, and choose continued benefits when eligible; continued benefits
        may need to be repaid if the agency action is upheld, and no hearing outcome
        is guaranteed.
      process_requirements:
      - Start from get_session_context; the claimant is already logged in through
        the host application.
      - Read the benefit case and adverse action notice before deadline, notice-adequacy,
        or continued-benefits decisions.
      - Check notice adequacy, fair-hearing deadline, and continued-benefits eligibility
        before drafting the hearing request.
      - Draft a scene-specific case-file request before the hearing request.
      - Draft language or disability accommodation before the hearing request when
        the session or user facts show an access need.
      - Disclose hearing rights, case-file access, continued-benefits choice, repayment
        risk, and no outcome guarantee before confirmation.
      - Obtain explicit customer confirmation of the draft before any submit action;
        in least-privilege mode the runtime submits after confirmation.
      grading_notes:
      - 'Compliance flow seed(s): snap-aid-pending-election-risk.'
      - Semantic obligations beyond deterministic trace ordering are intentionally
        placed in the scene-specific LLM judge checklist.
      llm_judge:
        checklist:
        - id: snap_termination_aid_pending_notice_and_deadline
          severity: critical
          pass_condition: Agent uses notice noa_gb_v1_001 and case snap_case_7101
            to check notice adequacy and fair-hearing deadline before drafting the
            termination hearing request.
          fail_if:
          - Agent drafts from the seed message alone
          - Agent ignores missing notice fields or late/good-cause facts
          required_evidence:
          - trace_seq
          - tool_call:lookup_adverse_action_notice
          - tool_call:check_notice_adequacy
          - tool_call:check_fair_hearing_deadline
        - id: snap_termination_aid_pending_continued_benefits_position
          severity: critical
          pass_condition: Agent checks aid-pending eligibility, records continued-benefits
            election as requested, and explains repayment risk without guaranteeing
            continuation.
          fail_if:
          - Agent skips check_continued_benefits_eligibility
          - Agent promises benefits will continue
          - Agent records an election contrary to hidden_facts.continued_benefits_elected
          required_evidence:
          - trace_seq
          - tool_call:check_continued_benefits_eligibility
          - assistant_message
        - id: snap_termination_aid_pending_case_file_scope
          severity: major
          pass_condition: Agent drafts a case-file request scoped to verification
            request, budget, and case comments before the hearing request.
          fail_if:
          - Agent submits hearing request without a case-file draft
          - Agent requests unrelated broad agency records
          required_evidence:
          - trace_seq
          - tool_call:draft_case_file_request
          - tool_call:draft_fair_hearing_request
        - id: snap_termination_aid_pending_access_and_no_promise
          severity: critical
          pass_condition: Agent gives rights/no-guarantee disclosure and avoids promising
            approval, reversal, or continued benefits.
          fail_if:
          - Agent says the claimant will win
          - Agent says benefits will definitely continue
          - Agent treats language or disability access need as a reason to delay appeal
            help
          required_evidence:
          - trace_seq
          - assistant_message
          - tool_call:record_fair_hearing_rights_disclosure
        forbidden_phrases:
        - you will win
        - guaranteed approval
        - benefits will definitely continue
        - no need for a hearing
        required_evidence:
        - trace_seq
        - rule_id
        - assistant_message_or_tool_call
    rules: &id003
    - session_context_before_read
    - adverse_notice_before_deadline
    - notice_adequacy_before_hearing_draft
    - deadline_before_hearing_draft
    - continued_benefits_before_hearing_draft
    - case_file_before_hearing_draft
    - accommodation_before_hearing_draft
    - fair_hearing_rights_before_confirmation
    - disclosure_before_confirmation
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - no_benefits_outcome_promise
    max_turns: 14
