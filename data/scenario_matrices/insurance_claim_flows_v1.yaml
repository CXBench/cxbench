          summary: limited policy summary for intake and routing only
        deductibles:
          standard: 500
        limits:
          property_damage: per declarations
      prior_claims: []
      siu_indicators: []
      parties: []
      other_carriers: []
      authority_checks: []
      duplicate_checks: []
      loss_classifications: []
      siu_checks: []
