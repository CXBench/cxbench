id: INS-FLOW-001.us
title: Auto collision FNOL acknowledgment
domain: insurance
scenario: auto_collision_fnol_ack
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs help with auto collision fnol acknowledgment while preserving
  process compliance and no outcome promise.
seed_message: I was hit in a parking lot yesterday and need to start a claim.
hidden_facts:
  customer_id: ins_cus_v1_001
  policy_id: pol_ins_v1_001
  policy_line: auto
  reporter_role: named_insured
  loss_date: '2026-06-12'
  loss_location: Grocery parking lot in Richmond VA
  loss_cause: parked_vehicle_hit
  loss_description: Parked car hit; rear bumper damage, no injuries reported.
  loss_type: auto_physical_damage
  reason: ordinary_fnol_intake
  expected_outcome_type: claim_intake
initial_state:
  session_context:
    session_id: sess_ins_v1_001
    customer_id: ins_cus_v1_001
    authenticated: true
    channel: secure_app
    role: named_insured
    scopes:
    - insurance:read_policy
    - insurance:read_claim
    - insurance:create_draft
  customer:
    customer_id: ins_cus_v1_001
    display_name: Insurance Flow Customer 001
    locale: en-US
  policies:
  - policy_id: pol_ins_v1_001
    line: auto
    term_status: active
    term_source: policy_admin_fixture
    effective_date: '2026-01-01'
    expiration_date: '2026-12-31'
    named_insureds:
    - ins_cus_v1_001
    coverage_summary:
      summary: limited policy summary for intake and routing only
    deductibles:
      standard: 500
    limits:
      property_damage: per declarations
  prior_claims: []
  siu_indicators: []
  parties: []
  other_carriers: []
  authority_checks: []
  duplicate_checks: []
  loss_classifications: []
  siu_checks: []
  policy_term_checks: []
  acknowledgments: []
  disclosures: []
  drafts: []
  evidence_requests: []
  claim_cases: []
  adjuster_routes: []
  duplicate_review_cases: []
  siu_handoffs: []
  support_handoffs: []
  policy_term_reviews: []
  subrogation_referrals: []
  vehicle_loss_assessments: []
  tow_storage_requests: []
  claim_withdrawal_requests: []
  claim_close_requests: []
  claim_reopen_requests: []
  claim_status_inquiries: []
  outbox: []
tools:
  read:
  - get_session_context
  - list_policies
  - get_policy_summary
  - get_claim_status
  check:
  - check_reporter_authority
  - check_duplicate_claim
  - classify_loss_type
  - check_siu_referral_signal
  draft:
  - draft_fnol
  - draft_evidence_request
  notice:
  - record_claim_acknowledgment
  - record_no_promise_disclosure
  submit:
