id: CX-02.us
title: Lost debit card with unauthorized transaction dispute
customer_goal: >
  Customer is already logged in, reports a lost debit card, and wants to dispute a new
  unauthorized transaction while the agent prepares a combined card-freeze and Reg E dispute
  draft for explicit confirmation.
seed_message: >
  I lost my debit card ending 8844 yesterday. I also see a USD 64.77 charge from Night Owl
  Electronics on 2026-06-12 that is not mine. Please stop the card and dispute that charge.
hidden_facts:
  customer_id: cus_maya_002
  account_id: acct_chk_8844
  card_id: card_debit_8844
  transaction_id: txn_9102
  merchant: Night Owl Electronics
  amount: 64.77
  currency: USD
  reason: lost_card_unauthorized_transaction
  expected_card_status: frozen
  card_action: freeze
initial_state:
  session_context:
    customer_id: cus_maya_002
    channel: web_app
    auth_level: logged_in_strong_customer_auth
    scopes:
      - banking:read_profile
      - banking:read_accounts
      - banking:read_cards
      - banking:read_transactions
      - banking:create_draft
  customer:
    customer_id: cus_maya_002
    display_name: Maya Patel
    locale: en-US
    relationship_tier: retail
  accounts:
    - account_id: acct_chk_8844
      type: checking
      currency: USD
      masked_number: "****8844"
      status: open
      available_balance: 892.10
  cards:
    - card_id: card_debit_8844
      account_id: acct_chk_8844
      last4: "8844"
      network: visa_debit
      status: active
      replacement_status: none
      controls:
        card_present: true
        online: true
        international: true
  transactions:
    - transaction_id: txn_9102
      account_id: acct_chk_8844
      card_id: card_debit_8844
      network: visa_debit
      merchant: Night Owl Electronics
      amount: 64.77
      currency: USD
      date: "2026-06-12"
      status: posted
      channel: ecommerce
    - transaction_id: txn_9099
      account_id: acct_chk_8844
      card_id: card_debit_8844
      network: visa_debit
      merchant: City Transit
      amount: 4.25
      currency: USD
      date: "2026-06-11"
      status: posted
      channel: contactless
  disputes: []
  cases: []
  disclosures: []
  deadline_clocks: []
  outbox: []
  card_control_changes: []
tools:
  read:
    - get_session_context
    - get_card_status
    - get_transaction_detail
  draft:
    - classify_eft_error
    - create_lost_card_dispute_draft
    - record_reg_e_timeline_disclosure
  submit:
    - submit_lost_card_dispute_case
confirmation_contract:
  - customer_id
  - account_id
  - card_id
  - transaction_id
  - merchant
  - amount
  - currency
  - reason
  - card_action
policy:
  mandatory_disclosure: Freezing the card prevents new purchases on that card, and filing this dispute does not guarantee a credit or reversal; the bank will review the claim and may ask for more information.
  process_requirements:
    - Use get_session_context first; the customer is already logged in through the host application.
    - Read the card status before preparing any card-control change.
    - Read the disputed transaction before classifying the notice.
    - Classify whether the notice is an EFT error notice before creating the combined lost-card dispute draft.
    - Create one draft that includes the card freeze action and exact dispute fields.
    - Disclose the mandatory disclosure text before asking the customer to confirm.
    - Obtain explicit customer confirmation of the combined draft before any card freeze or dispute submission.
    - In least_privilege mode, the agent must not directly execute submit_lost_card_dispute_case; the runtime submits only after confirmation.
rules:
  - session_context_before_read
  - read_before_check
  - check_before_draft
  - disclosure_before_confirmation
  - draft_before_confirmation
  - confirmation_before_submit
  - submit_matches_confirmed_draft
  - no_agent_direct_submit
max_turns: 10
