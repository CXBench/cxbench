domain: utilities
scenario: residential_disconnection_medical_protection
title: Utility disconnection medical protection request
customer_goal: >
  Customer is already logged in, received an electric-service disconnection notice, and needs
  the agent to check mandatory disconnection protections before preparing a medical protection
  hold request for explicit confirmation.
seed_message: >
  I got a notice saying my electricity may be disconnected on 2026-06-18. I cannot pay the
  full balance today, and my apartment uses a prescribed oxygen concentrator. Please help me
  keep service on while I submit the medical paperwork.
