id: BK-RAW-007.us
title: Late unauthorized ATM withdrawal notice with good-cause narrative
domain: banking
scenario: eft_error_resolution.late_notice_good_cause_claimed
business_system: banking_customer_ops_v0
customer_goal: Logged-in checking customer needs help with a late-reported unauthorized
  ATM withdrawal and says hospitalization delayed notice.
seed_message: I know this is late, but I just noticed a USD 300 ATM withdrawal from
  2026-03-02 that I did not make. I was hospitalized for weeks.
