id: HC-V1-005.us
title: External review after final internal denial
domain: healthcare
scenario: external_review_final_denial
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs external review after final internal denial while preserving
  HIPAA minimum necessary and appeal-rights gates.
seed_message: 'Here’s a rephrased version with the specified values removed and the compliance term softened:


  “I received a final internal denial for surgery and want to request an independent review.”


  If you want, I can also produce:

  1. a more formal version for an insurer letter, or

  2. a shorter patient-facing version.'
