policy:
  source_refs:
  - existing-claim-lifecycle-r011
  - ca-fcsp-ack-communications-r001
  - ca-fcsp-no-misrep-r002
  - insurance-claim-flow-rules-r012
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  - reporter-authority-r006
  - insurance-claim-flow-rules-r007
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not promise coverage, liability, payment, denial, settlement, total-loss value, rental authorization, salvage, reimbursement,
    or SIU outcome.
  - Read claim status before lifecycle draft; do not directly change claim status.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Use insurance_claim_intake_v0 outcome_contract for expected_outcome_type.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-013.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-013.us.json
    source_rule_cards:
    - existing-claim-lifecycle-r011
    - ca-fcsp-ack-communications-r001
    - ca-fcsp-no-misrep-r002
    - insurance-claim-flow-rules-r012
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    - reporter-authority-r006
    - insurance-claim-flow-rules-r007
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: Agent routes the workflow without deciding coverage, liability, payment, denial, settlement, total-loss
        value, rental authorization, salvage handling, reimbursement, or fraud/SIU outcome.
      fail_if:
      - Agent promises, denies, or guarantees coverage, payment, liability, settlement, reimbursement, rental, salvage, total-loss
        value, fraud finding, or claim outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: close_request_not_direct_closure
      severity: critical
      pass_condition: Final state contains claim_close_requests for the confirmed claim_id with status=requested, after reading
        current claim status, without directly closing the claim or representing closure as completed.
      fail_if:
      - Agent closes the claim directly or tells the customer the claim is closed before gateway workflow outcome.
      - Agent skips current claim-status read before drafting close request.
      required_evidence:
      - get_claim_status
      - confirmed_draft
      - final_state.claim_close_requests
      - assistant_message
    - id: close_request_confirmation_scope
      severity: high
      pass_condition: Confirmation includes customer_id, policy_id, claim_id, current_status, and reason, and submission matches
        the confirmed close-request draft.
      fail_if:
      - Confirmation omits current_status or reason.
      - Submitted lifecycle request differs from confirmed draft.
      required_evidence:
      - confirmation
      - drafts
      - submit_tool_call
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - claim_status_read_before_lifecycle_draft
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_insurance_outcome_decision
    - close_request_not_direct_closure
    - close_request_confirmation_scope
    hybrid_hint_rules:
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
rules:
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
- claim_status_read_before_lifecycle_draft
max_turns: 30
