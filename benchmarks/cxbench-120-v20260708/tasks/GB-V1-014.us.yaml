id: GB-V1-014.us
title: Medicaid Spanish notice and interpreter request
domain: government_benefits
scenario: medicaid_lep_spanish
business_system: government_benefits_appeal_v0
customer_goal: Logged-in Medicaid claimant needs help appealing a termination notice and requesting Spanish interpretation
  and translated notices while preserving hearing rights, case-file access, continued-services boundaries, and no outcome
  promise.
seed_message: Mi cobertura de my benefits va a terminar y necesito apelar con un interprete en espanol.
