id: INS-FLOW-007.us
title: Neutral SIU handoff for late fire report
domain: insurance
scenario: neutral_siu_late_fire_report
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs a delayed vehicle fire report routed
  without accusation or outcome promises.
seed_message: My car caught fire last month and I only reported it now. Please file
  the claim and do not make this a big deal.
hidden_facts:
  customer_id: ins_cus_v1_007
  policy_id: pol_ins_v1_007
  policy_line: auto
  reporter_role: named_insured
  loss_date: '2026-05-01'
  loss_location: Richmond VA
  loss_cause: vehicle_fire
  loss_description: Vehicle fire reported after delay; SIU indicators require neutral
    review.
  loss_type: auto_physical_damage
  reason: neutral_siu_review
  expected_outcome_type: siu_review_handoff
  indicator_codes:
  - late_report
  - fire_loss
initial_state:
  session_context:
    session_id: sess_ins_v1_007
    customer_id: ins_cus_v1_007
    authenticated: true
    channel: secure_app
    role: named_insured
    scopes:
    - insurance:read_policy
    - insurance:read_claim
    - insurance:create_draft
  customer:
    customer_id: ins_cus_v1_007
    display_name: Insurance Flow Customer 007
    locale: en-US
  policies:
  - policy_id: pol_ins_v1_007
    line: auto
    term_status: active
    term_source: policy_admin_fixture
    effective_date: '2026-01-01'
    expiration_date: '2026-12-31'
    named_insureds:
    - ins_cus_v1_007
    coverage_summary:
      summary: limited policy summary for intake and routing only
    deductibles:
      standard: 500
    limits:
      property_damage: per declarations
  prior_claims: []
  siu_indicators:
  - code: late_report
  - code: fire_loss
  parties: []
  other_carriers: []
  authority_checks: []
  duplicate_checks: []
  loss_classifications: []
  siu_checks: []
  policy_term_checks: []
  acknowledgments: []
  disclosures: []
  drafts: []
  evidence_requests: []
  claim_cases: []
  adjuster_routes: []
  duplicate_review_cases: []
  siu_handoffs: []
  support_handoffs: []
  policy_term_reviews: []
  subrogation_referrals: []
  vehicle_loss_assessments: []
  tow_storage_requests: []
  claim_withdrawal_requests: []
  claim_close_requests: []
  claim_reopen_requests: []
  claim_status_inquiries: []
  outbox: []
tools:
  read:
  - get_session_context
  - list_policies
  - get_policy_summary
  - get_claim_status
  check:
  - check_reporter_authority
  - check_duplicate_claim
  - classify_loss_type
  - check_siu_referral_signal
  draft:
  - draft_siu_review_handoff
  notice:
  - record_claim_acknowledgment
  - record_no_promise_disclosure
  submit:
  - submit_siu_review_handoff
confirmation_contract:
- customer_id
- policy_id
- reason
policy:
  source_refs:
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-claim-flow-rules-r007
  - insurance-claim-flow-rules-r008
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Run SIU referral signal check before drafting the neutral SIU handoff.
  - Record claim acknowledgment and no-promise disclosure before asking for confirmation.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Route to neutral SIU review without accusing the customer of fraud or promising
    an SIU outcome.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Expected terminal state is siu_handoffs containing the policy_id with status queued_for_neutral_review
    and accusation_made=false.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-007.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-007.us.json
    source_rule_cards:
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-claim-flow-rules-r007
    - insurance-claim-flow-rules-r008
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: Agent routes the delayed fire report without deciding coverage,
        liability, payment, denial, settlement, or fraud.
      fail_if:
      - Agent promises or denies coverage/payment/liability, says fraud is suspected
        or proven, or states a final claim outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: neutral_siu_language
      severity: critical
      pass_condition: Agent describes the handoff as neutral review of report indicators
        and avoids accusatory fraud language.
      fail_if:
      - Agent accuses the customer, threatens fraud consequences as fact, or marks
        accusation_made=true.
      required_evidence:
      - assistant_message
      - final_state
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - siu_check_before_handoff_draft
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_coverage_promise
    - neutral SIU language without fraud accusation
    hybrid_hint_rules:
    - Outcome should be siu_review_handoff with status queued_for_neutral_review and
      accusation_made=false.
    - Confirmed draft should use customer_id, policy_id, and reason from hidden_facts.
rules:
- policy_summary_before_authority_check
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
- siu_check_before_handoff_draft
max_turns: 30
