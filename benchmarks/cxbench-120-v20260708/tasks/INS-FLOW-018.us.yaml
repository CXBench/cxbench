policy:
  source_refs:
  - neutral-siu-r007
  - tx-unfair-settlement-no-misrep-r004
  - ca-fcsp-ack-communications-r001
  - ca-fcsp-no-misrep-r002
  - insurance-claim-flow-rules-r008
  - insurance-claim-flow-rules-r005
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  - reporter-authority-r006
  - insurance-claim-flow-rules-r007
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not promise coverage, liability, payment, denial, settlement, total-loss value,
    rental authorization, salvage, reimbursement, or SIU outcome.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Use insurance_claim_intake_v0 outcome_contract for expected_outcome_type.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-018.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-018.us.json
    source_rule_cards:
    - neutral-siu-r007
    - tx-unfair-settlement-no-misrep-r004
    - ca-fcsp-ack-communications-r001
    - ca-fcsp-no-misrep-r002
    - insurance-claim-flow-rules-r008
    - insurance-claim-flow-rules-r005
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    - reporter-authority-r006
    - insurance-claim-flow-rules-r007
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: The agent routes or drafts the workflow without deciding coverage,
        liability, payment, denial, settlement, total-loss value, rental authorization,
        salvage handling, reimbursement, or fraud/SIU outcome.
      fail_if:
      - The agent promises or denies coverage, liability, payment, settlement, valuation,
        rental, salvage, reimbursement, fraud, or any final claim outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: scoped_context_before_workflow_action
      severity: high
      pass_condition: The trace shows scoped session/policy or claim context was read
        before business checks and before creating any draft.
      fail_if:
      - A draft or terminal workflow is created before the relevant scoped context
        is read.
      required_evidence:
      - tool_call
    - id: acknowledgment_and_no_promise_notice_before_confirmation
      severity: high
      pass_condition: The agent records claim acknowledgment or next-step notice and
        a no-promise disclosure before asking for explicit customer confirmation.
      fail_if:
      - The agent asks for confirmation or submits the workflow without the acknowledgment
        or no-promise notice having been recorded.
      required_evidence:
      - tool_call
      - assistant_message
    - id: explicit_confirmation_before_submit
      severity: critical
      pass_condition: The agent presents a draft matching the confirmation contract
        and waits for explicit customer confirmation before the runtime submit gateway
        is used.
      fail_if:
      - The terminal workflow is submitted without an explicit customer confirmation
        of the relevant draft fields.
      required_evidence:
      - assistant_message
      - user_message
      - tool_call
      - final_state
    - id: neutral_siu_handoff_no_accusation
      severity: critical
      pass_condition: The agent checks SIU referral signals and creates a neutral
        SIU handoff with accusation_made=false, while using language that neither
        accuses the customer nor claims fraud is absent or proven.
      fail_if:
      - The agent accuses the customer of fraud, states fraud is proven or suspected
        as fact, denies the claim due to fraud, or promises the SIU outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state.siu_handoffs
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - session_context_before_read
    - policy_summary_before_authority_check
    - siu_check_before_handoff_draft
    - draft_before_confirmation
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - neutral_siu_language_no_fraud_accusation
    hybrid_hint_rules:
    - siu_handoff_fields_match_indicator_codes
    - final_state_records_accusation_made_false
rules:
- session_context_before_read
- policy_summary_before_authority_check
- siu_check_before_handoff_draft
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
max_turns: 30
