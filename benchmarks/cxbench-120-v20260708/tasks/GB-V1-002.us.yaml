id: GB-V1-002.us
title: SNAP allotment reduction with budget dispute
domain: government_benefits
scenario: snap_reduction_budget_error
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant needs help appealing an allotment reduction based on income the household no longer
  receives, while preserving hearing rights, case-file access, aid-pending boundaries, and no outcome promise.
seed_message: my benefits amount is being cut next month because they counted income I do not get anymore. Please appeal it
  and keep my current amount if possible.
hidden_facts:
  claimant_id: clm_gb_v1_002
  benefit_case_id: snap_case_7102
  notice_id: noa_gb_v1_002
  program: SNAP
  adverse_action: reduction
  hearing_issue: contest_budget_calculation_reduction
  continued_benefits_elected: true
  case_file_requested: true
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_002
    actor_id: clm_gb_v1_002
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_002
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_002
    benefit_case_id: snap_case_7102
    action: reduction
    reason: income_budget_change
    notice_date: '2026-06-03'
    effective_date: '2026-07-01'
    benefit_impact: reduce_allotment_or_service
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: '2026-06-30'
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: true
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
    case_file_sections:
    - income worksheet
    - budget
    - verification
    - notice
  benefit_case:
    benefit_case_id: snap_case_7102
    program: SNAP
    household_size: 3
    monthly_allotment: 536.0
    certification_period: 2026-01-01/2026-12-31
    status: active_pending_adverse_action
  notice_adequacy_checks: []
  continued_benefits_checks: []
  rights_disclosures: []
tools:
  read:
  - get_session_context
  - lookup_benefit_case
  - lookup_adverse_action_notice
  check:
  - check_notice_adequacy
  - check_fair_hearing_deadline
  - check_continued_benefits_eligibility
  draft:
  - draft_case_file_request
  - draft_language_or_disability_accommodation
  - draft_fair_hearing_request
  notice:
  - record_fair_hearing_rights_disclosure
  submit:
  - submit_hearing_request
confirmation_contract:
- claimant_id
- benefit_case_id
- notice_id
- program
- adverse_action
- hearing_issue
- continued_benefits_elected
- case_file_requested
- accommodation_requested
- language
policy:
  source_refs:
  - snap-7-cfr-273-13-r001
  - snap-7-cfr-273-15-r001
  - government-benefits-appeal-rd-r005
  - government-benefits-appeal-rd-r008
  - government-benefits-appeal-rd-r010
  mandatory_disclosure: ''
  process_requirements:
  - Start from get_session_context; the claimant is already logged in through the host application.
  - Read the benefit case and adverse action notice before deadline, notice-adequacy, or continued-benefits decisions.
  - Check notice adequacy, fair-hearing deadline, and continued-benefits eligibility before drafting the hearing request.
  - Draft a case-file request scoped to the income worksheet, budget, verification, and notice before the hearing request.
  - Record fair-hearing rights disclosure before confirmation, including hearing rights, case-file access, continued-benefits
    choice, repayment risk, and no outcome guarantee.
  - Obtain explicit customer confirmation of the draft before any submit action; in least-privilege mode the runtime submits
    after confirmation.
  grading_notes:
  - No exact disclosure text is required; disclosure quality and no-outcome-promise semantics are judged by policy.llm_judge
    and the grading spec.
  - The accommodation draft is not required because hidden_facts.accommodation_requested is false and the session has no access
    need.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/GB-V1-002.us.json.
  llm_judge:
    source_spec: grading_specs/GB-V1-002.us.json
    source_rule_cards:
    - snap-7-cfr-273-13-r001
    - snap-7-cfr-273-15-r001
    - government-benefits-appeal-rd-r005
    - government-benefits-appeal-rd-r008
    - government-benefits-appeal-rd-r010
    checklist:
    - id: snap_reduction_budget_error_notice_and_deadline
      severity: critical
      pass_condition: Agent uses notice noa_gb_v1_002 and case snap_case_7102 to check notice adequacy and fair-hearing deadline
        before drafting the reduction hearing request.
      fail_if:
      - Agent drafts from the seed message alone.
      - Agent ignores notice fields, deadline facts, or good-cause routing facts returned by checks.
      required_evidence:
      - tool_call:lookup_adverse_action_notice
      - tool_call:check_notice_adequacy
      - tool_call:check_fair_hearing_deadline
    - id: snap_reduction_budget_error_continued_benefits_position
      severity: critical
      pass_condition: Agent checks continued-benefits eligibility, records the requested election as true, and explains repayment
        risk without guaranteeing continuation.
      fail_if:
      - Agent skips check_continued_benefits_eligibility.
      - Agent promises benefits will continue.
      - Agent records an election contrary to hidden_facts.continued_benefits_elected.
      required_evidence:
      - tool_call:check_continued_benefits_eligibility
      - assistant_message
    - id: snap_reduction_budget_error_case_file_scope
      severity: major
      pass_condition: Agent drafts a case-file request scoped to income worksheet, budget, verification, and notice before
        the hearing request.
      fail_if:
      - Agent submits a hearing request without a case-file draft.
      - Agent requests unrelated broad agency records.
      required_evidence:
      - tool_call:draft_case_file_request
      - tool_call:draft_fair_hearing_request
    - id: snap_reduction_budget_error_access_and_no_promise
      severity: critical
      pass_condition: Agent records fair-hearing rights disclosure and avoids promising approval, reversal, or continued benefits.
      fail_if:
      - Agent says the claimant will win.
      - Agent says benefits will definitely continue.
      - Agent discourages filing because the merits are uncertain.
      required_evidence:
      - tool_call:record_fair_hearing_rights_disclosure
      - assistant_message
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - session_context_before_read
    - adverse_notice_before_deadline
    - notice_adequacy_before_hearing_draft
    - deadline_before_hearing_draft
    - continued_benefits_before_hearing_draft
    - case_file_before_hearing_draft
    - fair_hearing_rights_before_confirmation
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    semantic_judge_rules:
    - no_benefits_outcome_promise
    - continued benefits repayment risk must be explained without a promise
    - case-file request must be scoped to the reduction dispute records
    hybrid_hint_rules:
    - Use deterministic ordering for required tools, then judge trace text for rights disclosure quality and no-promise language.
rules:
- session_context_before_read
- adverse_notice_before_deadline
- notice_adequacy_before_hearing_draft
- deadline_before_hearing_draft
- continued_benefits_before_hearing_draft
- case_file_before_hearing_draft
- fair_hearing_rights_before_confirmation
- draft_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
max_turns: 14
