id: utilities-disconnection-v1-011
title: PUC complaint handoff for contested shutoff notice
domain: utilities
scenario: puc_complaint_handoff_for_contested_notice
business_system: utilities_disconnection_v0
customer_goal: Logged-in California residential electric utility customer needs help
  preparing a PUC complaint handoff for a contested shutoff notice.
seed_message: 'Here’s a clean handoff draft you can use for a utility-regulator complaint
  intake, with the identifying values removed and the agency name generalized.


  **Complaint Handoff Draft**


  I am requesting help with a contested utility shutoff notice. I have already tried
  to resolve this issue twice directly with the utility, but the matter is still unresolved.


  I am concerned that service may be disconnected unfairly while the dispute is still
  active. I am asking for review and assistance so the account can remain protected
  while the complaint is evaluated.


  Key points for the handoff:

  - I dispute the notice and the balance being claimed.

  - I have made two good-faith attempts to resolve the issue with the utility.

  - I am requesting immediate review before any service interruption.

  - I want the account held in a safe status while the complaint is reviewed.

  - I can provide copies of the notice, prior correspondence, and billing records
  if needed.


  Suggested wording for the complaint:

  > I am filing a complaint regarding a disputed utility disconnection notice. I have
  tried twice to resolve this directly with the utility, but the issue remains unresolved.
  I request prompt review and protection from service loss while the dispute is being
  examined.


  If you want, I can also turn this into:

  1. a formal complaint letter,

  2. a call script for the regulator or utility, or

  3. a one-page evidence checklist for the handoff.'
