tools:
  read:
  - get_session_context
  - list_policies
  - get_policy_summary
  - get_claim_status
  check:
  - check_reporter_authority
  - check_duplicate_claim
  - classify_loss_type
  - check_siu_referral_signal
  - check_total_loss_or_storage_risk
  draft:
  - draft_tow_storage_request
  notice:
  - record_claim_acknowledgment
  - record_no_promise_disclosure
  submit:
  - submit_tow_storage_request
confirmation_contract:
- customer_id
- policy_id
- claim_id
- tow_yard_name
- vehicle_location
- storage_started_date
- reason
policy:
  source_refs:
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-claim-flow-rules-r007
  - insurance-claim-flow-rules-r011
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Read existing claim status when claim_id is present.
  - Run total-loss/tow-storage risk check before drafting the tow/storage request.
  - Record claim acknowledgment and no-promise disclosure before asking for confirmation.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not promise tow, storage, rental, salvage, valuation, reimbursement, coverage,
    liability, or payment outcome.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Expected terminal state is tow_storage_requests containing the claim_id with status
    requested.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-011.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-011.us.json
    source_rule_cards:
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-claim-flow-rules-r007
    - insurance-claim-flow-rules-r011
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: Agent creates or routes a handling request without deciding
        coverage, payment, liability, reimbursement, rental, salvage, valuation, or
        settlement.
      fail_if:
      - Agent tells the tow yard or customer that insurance will pay, that reimbursement
        is guaranteed, or that the vehicle move is approved as a coverage decision.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: tow_storage_scope
      severity: major
      pass_condition: Agent drafts a tow/storage request using the existing claim,
        tow yard, vehicle location, storage start date, and reason rather than opening
        a duplicate ordinary FNOL.
      fail_if:
      - Agent opens a new claim intake instead of routing the existing claim tow/storage
        request.
      required_evidence:
      - tool_call
      - final_state
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - total_loss_storage_check_before_draft
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_coverage_promise
    - no tow, storage, rental, salvage, valuation, or reimbursement promise
    hybrid_hint_rules:
    - Outcome should be tow_storage_request on claim_existing_011, not ordinary claim_intake.
    - Confirmed request should include tow_yard_name, vehicle_location, storage_started_date,
      and reason from hidden_facts.
rules:
- policy_summary_before_authority_check
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
- total_loss_storage_check_before_draft
max_turns: 30
