  loss_description: Reported auto loss; facts captured for adjuster review only.
  loss_type: auto_physical_damage
  reason: tow_storage_review
  expected_outcome_type: tow_storage_request
  claim_id: claim_existing_011
  vehicle_location: Northside Tow Yard
  tow_yard_name: Northside Tow Yard
  storage_started_date: '2026-06-10'
initial_state:
