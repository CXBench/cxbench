id: BK-RAW-011.us
title: Consumer reports lost access device within two business days
domain: banking
scenario: lost_card_and_eft_error.lost_access_device_timely_report
business_system: banking_customer_ops_v0
customer_goal: Logged-in checking customer needs help freezing a lost debit card and disputing a posted unauthorized charge.
seed_message: I lost my card two days ago and found a a charge I don't recognize I did not make. Please freeze it and dispute
  the charge.
hidden_facts:
