id: HC-V1-004.us
title: Continuity-of-care therapy denial appeal
domain: healthcare
scenario: continuity_care_denial
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare representative needs a continuity-of-care therapy
  denial appeal while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: My ongoing therapy sessions were denied mid-course. I need an appeal
  and continuity-of-care rights flagged.
hidden_facts:
  member_id: mem_hc_v1_004
  representative_id: rep_hc_v1_004
  plan_id: plan_group_ppo
  denial_id: denial_hc_v1_004
  claim_id: claim_hc_v1_004
  requested_action: internal_appeal
  requested_action_code: internal_appeal
  appeal_reason: continuity_of_care_supporting_records
  appeal_basis_code: continuity_of_care_supporting_records
  appeal_summary: Appeal the mid-course denial of ongoing physical therapy and flag
    continuity-of-care review based only on the denial, plan, and minimum necessary
    claim summary.
  urgency_requested: false
  expected_outcome_type: internal_appeal_submitted
initial_state:
  session_context:
    actor_id: rep_hc_v1_004
    member_id: mem_hc_v1_004
