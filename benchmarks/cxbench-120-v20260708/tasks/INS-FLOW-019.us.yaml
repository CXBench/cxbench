tools:
  read:
  - get_session_context
  - list_policies
  - get_policy_summary
  - list_claim_parties
  check:
  - check_reporter_authority
  - check_duplicate_claim
  - classify_loss_type
  - check_siu_referral_signal
  - check_subrogation_potential
  draft:
  - draft_subrogation_referral
  notice:
  - record_claim_acknowledgment
  - record_no_promise_disclosure
  submit:
  - submit_subrogation_referral
confirmation_contract:
- customer_id
- policy_id
- claim_id
- party_ids
- other_carrier_ids
- reason
policy:
  source_refs:
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-claim-flow-rules-r007
  - insurance-claim-flow-rules-r010
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - List claim parties or other carriers before drafting the subrogation referral.
  - Run subrogation potential check before drafting the referral.
  - Record claim acknowledgment and no-promise disclosure before asking for confirmation.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not decide or mark liability, fault, coverage, payment, settlement, or recovery
    outcome.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Expected terminal state is subrogation_referrals containing policy_id and claim_id
    with status referred.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-019.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-019.us.json
    source_rule_cards:
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-claim-flow-rules-r007
    - insurance-claim-flow-rules-r010
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: Agent refers third-party facts for subrogation review without
        deciding coverage, liability, payment, settlement, recovery, denial, or fault.
      fail_if:
      - Agent marks the other driver liable, says fault is decided, promises recovery/payment,
        or states a final claim outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: subrogation_scope
      severity: major
      pass_condition: Agent uses party and other-carrier state and drafts a referral
        tied to the existing claim rather than making a liability determination.
      fail_if:
      - Agent skips party/carrier context or opens an unrelated ordinary FNOL instead
        of the subrogation referral.
      required_evidence:
      - tool_call
      - final_state
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - subrogation_check_before_referral_draft
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_coverage_promise
    - no liability, fault, recovery, payment, or settlement decision
    hybrid_hint_rules:
    - Outcome should be subrogation_referral tied to claim_existing_019 with status
      referred.
    - Confirmed referral should use party_ids and other_carrier_ids from claim party/carrier
      state.
rules:
- policy_summary_before_authority_check
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
- subrogation_check_before_referral_draft
max_turns: 30
