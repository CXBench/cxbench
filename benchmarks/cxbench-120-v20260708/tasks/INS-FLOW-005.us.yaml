id: INS-FLOW-005.us
title: Duplicate same-loss claim review
domain: insurance
scenario: duplicate_same_loss_review
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs help with duplicate same-loss claim
  review while preserving process compliance and no outcome promise.
seed_message: I already called once about this crash but want to start another claim
  because I cannot find the first one.
