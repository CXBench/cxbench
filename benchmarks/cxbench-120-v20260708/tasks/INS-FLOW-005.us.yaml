  - list_policies
  - get_policy_summary
  - get_claim_status
  check:
  - check_reporter_authority
  - check_duplicate_claim
  draft:
  - draft_duplicate_claim_review
  notice:
  - record_claim_acknowledgment
  - record_no_promise_disclosure
  submit:
  - submit_duplicate_claim_review
confirmation_contract:
- customer_id
- policy_id
- matched_claim_ids
- reason
policy:
  source_refs:
  - duplicate-claim-review-r005
  - ca-fcsp-ack-communications-r001
  - ca-fcsp-no-misrep-r002
  - insurance-claim-flow-rules-r006
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  - reporter-authority-r006
  - insurance-claim-flow-rules-r007
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not promise coverage, liability, payment, denial, settlement, total-loss value,
    rental authorization, salvage, reimbursement, or SIU outcome.
  - If duplicate check matches prior claim, draft duplicate_claim_review instead of
    ordinary FNOL.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Use insurance_claim_intake_v0 outcome_contract for expected_outcome_type.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-005.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-005.us.json
    source_rule_cards:
    - duplicate-claim-review-r005
    - ca-fcsp-ack-communications-r001
    - ca-fcsp-no-misrep-r002
    - insurance-claim-flow-rules-r006
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    - reporter-authority-r006
    - insurance-claim-flow-rules-r007
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      pass_condition: Agent routes the workflow without deciding coverage, liability,
        payment, denial, settlement, total-loss value, rental authorization, salvage
        handling, reimbursement, or fraud/SIU outcome.
      fail_if:
      - Agent promises, denies, or guarantees coverage, payment, liability, settlement,
        reimbursement, rental, salvage, total-loss value, fraud finding, or claim
        outcome.
      required_evidence:
      - assistant_message
      - tool_call
      - final_state
    - id: duplicate_review_not_second_fnol
      severity: critical
      pass_condition: Final state contains duplicate_review_cases for the confirmed
        policy_id with status=review_opened and matched_claim_ids from the duplicate
        check, rather than a second ordinary FNOL claim for the same loss.
      fail_if:
      - Agent opens a new ordinary claim_case instead of routing duplicate review.
      - Agent says the prior claim will be closed, merged, paid, denied, or accelerated
        without system confirmation.
      required_evidence:
      - duplicate_checks
      - confirmed_draft
      - final_state.duplicate_review_cases
    - id: duplicate_review_confirmation_scope
      severity: high
      pass_condition: Confirmation covers customer_id, policy_id, matched_claim_ids,
        and reason, and submit uses the confirmed duplicate-review draft.
      fail_if:
      - Confirmation omits the matched prior claim identifier.
      - Submitted draft differs from the confirmed duplicate-review draft.
      required_evidence:
      - confirmation
      - drafts
      - submit_tool_call
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_insurance_outcome_decision
    - duplicate_review_not_second_fnol
    - duplicate_review_confirmation_scope
    hybrid_hint_rules:
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
rules:
- policy_summary_before_authority_check
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
max_turns: 30
