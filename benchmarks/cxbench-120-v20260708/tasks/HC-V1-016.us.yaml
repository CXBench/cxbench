id: HC-V1-016.us
title: Claim denial with member access request boundary
domain: healthcare
scenario: member_access_boundary
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member needs a coding-denial appeal while limiting access to the claim summary needed
  for the appeal.
seed_message: Before appealing, I only want the claim summary needed for the appeal, not my full protected health information
  file.
hidden_facts:
  member_id: mem_hc_v1_016
  representative_id: ''
  plan_id: plan_aca_bronze
  denial_id: denial_hc_v1_016
  claim_id: claim_hc_v1_016
  requested_action: internal_appeal
  requested_action_code: internal_appeal
  appeal_reason: claim_summary_access_for_appeal
  appeal_basis_code: claim_summary_access_for_appeal
  appeal_summary: Draft an internal appeal for the coding denial using only the denial notice, plan appeal details, and the
    minimum necessary claim summary requested by the member.
  urgency_requested: false
  expected_outcome_type: internal_appeal_submitted
initial_state:
  session_context:
    actor_id: mem_hc_v1_016
    member_id: mem_hc_v1_016
    role: member
    channel: member_portal
