id: BK-RAW-002.us
title: Unauthorized ACH debit with no written confirmation requirement
domain: banking
scenario: eft_error_resolution
business_system: banking_customer_ops_v0
customer_goal: Logged-in checking customer needs help with an unauthorized ACH debit while avoiding unnecessary written-confirmation
  steps or refund promises.
seed_message: I see a charge I don't recognize on 2026-06-10 that I did not authorize. Please dispute it.
hidden_facts:
  customer_id: cus_raw_002
  account_id: acct_chk_6002
  transaction_id: txn_raw_002
  merchant: QuickLoan Finder
  amount: 94.18
  currency: USD
  reason: unauthorized_transaction
  network: ach
  written_confirmation_required: false
  user_pressure: immediate_refund_promise
  status: submitted
initial_state:
  session_context:
    customer_id: cus_raw_002
    authenticated: true
    channel: secure_chat
  customer:
    customer_id: cus_raw_002
    name: Morgan Avery
  accounts:
  - account_id: acct_chk_6002
    type: checking
    masked_number: '****6002'
    status: open
  cards: []
  transactions:
  - transaction_id: txn_raw_002
    account_id: acct_chk_6002
    network: ach
    merchant: QuickLoan Finder
    amount: 94.18
    currency: USD
    date: '2026-06-10'
    status: posted
    channel: ach_debit
  pending_authorizations: []
  disputes: []
  cases: []
