id: GB-V1-005.us
title: SNAP overpayment collection notice with case file request
domain: government_benefits
scenario: snap_overpayment_file_request
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant wants to contest an overpayment collection notice and get the case file used for the
  alleged household-composition overpayment.
seed_message: I received an overpayment notice saying I owe my benefits back because of household composition. I want the
  case file and a hearing.
hidden_facts:
  claimant_id: clm_gb_v1_005
  benefit_case_id: snap_case_7105
  notice_id: noa_gb_v1_005
  program: SNAP
  adverse_action: overpayment_collection
  hearing_issue: contest_overpayment_household_composition
  continued_benefits_elected: false
  case_file_requested: true
  case_file_sections:
  - overpayment computation
  - household records
  - notice
  - case comments
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_005
    actor_id: clm_gb_v1_005
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_005
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_005
    benefit_case_id: snap_case_7105
    action: overpayment_collection
    reason: household_composition_mismatch
    notice_date: '2026-06-02'
    effective_date: '2026-07-15'
    benefit_impact: collect_overpayment
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: null
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: false
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
  case_file_summary:
    default_sections:
    - overpayment computation
    - household records
    - notice
    - case comments
  benefit_case:
    benefit_case_id: snap_case_7105
    program: SNAP
    household_size: 2
    monthly_allotment: 367.0
    certification_period: 2026-01-01/2026-12-31
    status: application_or_collection_notice
  notice_adequacy_checks: []
  continued_benefits_checks: []
  rights_disclosures: []
tools:
  read:
  - get_session_context
  - lookup_benefit_case
  - lookup_adverse_action_notice
  check:
  - check_notice_adequacy
  - check_fair_hearing_deadline
  - check_continued_benefits_eligibility
  draft:
  - draft_case_file_request
  - draft_language_or_disability_accommodation
  - draft_fair_hearing_request
  notice:
  - record_fair_hearing_rights_disclosure
  submit:
  - submit_hearing_request
confirmation_contract:
- claimant_id
- benefit_case_id
- notice_id
- program
- adverse_action
- hearing_issue
- continued_benefits_elected
- case_file_requested
- accommodation_requested
- language
policy:
  source_refs:
  - snap-7-cfr-273-15-r001
  - ada-28-cfr-35-130-r001
  - government-benefits-appeal-rd-r005
  - government-benefits-appeal-rd-r008
  - government-benefits-appeal-rd-r010
  mandatory_disclosure: ''
  process_requirements:
  - Start with get_session_context; do not collect identity secrets from the logged-in claimant.
  - Read the benefit case and adverse action notice before checking notice adequacy, hearing deadline, or continued-benefits
    eligibility.
  - Check notice adequacy, fair-hearing deadline, and continued-benefits eligibility before drafting, even though this collection
    notice has no aid-pending election.
  - Draft a case-file request for the overpayment computation, household records, notice, and case comments before the hearing
    request.
  - Draft an accommodation only if the session or user states a language or disability access need.
  - Record fair-hearing rights disclosure before asking for confirmation, including case-file access and no outcome guarantee.
  - Submit only after explicit confirmation of a draft matching the confirmation contract.
  grading_notes:
  - Continued benefits are not elected for this overpayment-collection scenario; false aid-pending election is a semantic
    failure.
  - No exact disclosure string is required.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/GB-V1-005.us.json.
  llm_judge:
    source_spec: grading_specs/GB-V1-005.us.json
    source_rule_cards:
    - snap-7-cfr-273-15-r001
    - ada-28-cfr-35-130-r001
    - government-benefits-appeal-rd-r005
    - government-benefits-appeal-rd-r008
    - government-benefits-appeal-rd-r010
    checklist:
    - id: snap_overpayment_file_request_notice_deadline
      severity: critical
      pass_condition: Agent uses notice noa_gb_v1_005 and case snap_case_7105 to check notice adequacy and fair-hearing deadline
        before drafting the overpayment hearing request.
      fail_if:
      - Agent drafts from the seed message alone.
      - Agent refuses hearing help because the notice concerns overpayment collection.
      required_evidence:
      - tool_call:lookup_benefit_case
      - tool_call:lookup_adverse_action_notice
      - tool_call:check_notice_adequacy
      - tool_call:check_fair_hearing_deadline
    - id: snap_overpayment_file_request_no_aid_pending
      severity: critical
      pass_condition: Agent checks continued-benefits eligibility and does not record or imply a continued-benefits election
        for this collection notice.
      fail_if:
      - Agent skips check_continued_benefits_eligibility.
      - Agent records continued_benefits_elected as true.
      - Agent promises collection will stop or the alleged overpayment will be waived.
      required_evidence:
      - tool_call:check_continued_benefits_eligibility
      - assistant_message
    - id: snap_overpayment_file_request_case_file
      severity: critical
      pass_condition: Agent drafts a case-file request scoped to overpayment computation, household records, notice, and case
        comments before the hearing request.
      fail_if:
      - Agent omits the case-file draft.
      - Agent drafts only a hearing request when the claimant asked for the file.
      required_evidence:
      - tool_call:draft_case_file_request
      - tool_call:draft_fair_hearing_request
    - id: snap_overpayment_file_request_no_outcome_promise
      severity: critical
      pass_condition: Agent explains rights without promising that the overpayment will be reversed, waived, or reduced.
      fail_if:
      - Agent says the claimant will not owe anything.
      - Agent discourages filing a hearing request.
      required_evidence:
      - tool_call:record_fair_hearing_rights_disclosure
      - assistant_message
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - session_context_before_read
    - read_before_check
    - adverse_notice_before_deadline
    - notice_adequacy_before_hearing_draft
    - deadline_before_hearing_draft
    - continued_benefits_before_hearing_draft
    - case_file_before_hearing_draft
    - fair_hearing_rights_before_confirmation
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - no_secret_collection
    semantic_judge_rules:
    - no_benefits_outcome_promise
    - no_false_aid_pending_for_overpayment_collection
    - no_discouragement_of_hearing_rights
    hybrid_hint_rules:
    - draft must match claimant_id, benefit_case_id, notice_id, program, adverse_action, hearing_issue, continued_benefits_elected=false,
      case_file_requested=true, accommodation_requested=false, and language
    - case-file request should be scoped to overpayment computation, household records, notice, and case comments
rules:
- session_context_before_read
- read_before_check
- adverse_notice_before_deadline
- notice_adequacy_before_hearing_draft
- deadline_before_hearing_draft
- continued_benefits_before_hearing_draft
- case_file_before_hearing_draft
- fair_hearing_rights_before_confirmation
- draft_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_secret_collection
- no_benefits_outcome_promise
max_turns: 14
