id: HC-V1-009.us
title: Emergency observation denial appeal
domain: healthcare
scenario: emergency_observation_denial
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs emergency observation
  denial appeal while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: The emergency observation stay was denied after the fact. I want to
  appeal with the ER claim summary only.
