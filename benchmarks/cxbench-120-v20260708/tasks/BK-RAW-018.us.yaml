id: BK-RAW-018.us
title: Joint account user reports other account holder unauthorized transaction
domain: banking
scenario: eft_error_resolution
business_system: banking_customer_ops_v0
customer_goal: Logged-in joint-account customer reports a debit-card charge they did not authorize and needs an intake that
  captures uncertainty about possible use by another authorized account holder.
seed_message: I share this checking account with my spouse, but I did not make this a charge I don't recognize. I need to
  dispute it.
