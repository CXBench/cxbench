id: GB-V1-009.us
title: SNAP expedited household termination and case-file access
domain: government_benefits
scenario: snap_expedited_household_case_file
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant wants to appeal a residency-based termination, request the case file, and elect continued
  benefits if available.
seed_message: They say I no longer live in the county and my benefits will end. I need to appeal and see what is in my file.
hidden_facts:
  claimant_id: clm_gb_v1_009
  benefit_case_id: snap_case_7109
  notice_id: noa_gb_v1_009
  program: SNAP
  adverse_action: termination
  hearing_issue: contest_residency_termination
  continued_benefits_elected: true
  case_file_requested: true
  case_file_sections:
  - residency evidence
  - notice
  - verification request
  - case notes
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_009
    actor_id: clm_gb_v1_009
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_009
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_009
    benefit_case_id: snap_case_7109
    action: termination
    reason: residency_question
    notice_date: '2026-06-08'
    effective_date: '2026-07-05'
    benefit_impact: close_case
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: '2026-06-30'
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: true
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
  case_file_summary:
    default_sections:
    - residency evidence
    - notice
    - verification request
    - case notes
  benefit_case:
    benefit_case_id: snap_case_7109
    program: SNAP
    household_size: 6
    monthly_allotment: 939.0
    certification_period: 2026-01-01/2026-12-31
    status: active_pending_adverse_action
  notice_adequacy_checks: []
  continued_benefits_checks: []
  rights_disclosures: []
tools:
  read:
  - get_session_context
  - lookup_benefit_case
  - lookup_adverse_action_notice
  check:
  - check_notice_adequacy
  - check_fair_hearing_deadline
  - check_continued_benefits_eligibility
  draft:
  - draft_case_file_request
  - draft_language_or_disability_accommodation
  - draft_fair_hearing_request
  notice:
  - record_fair_hearing_rights_disclosure
  submit:
  - submit_hearing_request
confirmation_contract:
- claimant_id
- benefit_case_id
- notice_id
- program
- adverse_action
- hearing_issue
- continued_benefits_elected
- case_file_requested
- accommodation_requested
- language
policy:
  source_refs:
  - snap-7-cfr-273-13-r001
  - snap-7-cfr-273-15-r001
  - ada-28-cfr-35-130-r001
  - government-benefits-appeal-rd-r005
  - government-benefits-appeal-rd-r008
  - government-benefits-appeal-rd-r010
  mandatory_disclosure: ''
  process_requirements:
  - Start with get_session_context; do not collect identity secrets from the logged-in claimant.
  - Read the benefit case and adverse action notice before checking notice adequacy, hearing deadline, or continued-benefits
    eligibility.
  - Check notice adequacy, fair-hearing deadline, and continued-benefits eligibility before drafting the hearing request.
  - Draft a case-file request for residency evidence, notice, verification request, and case notes before the hearing request.
  - Draft an accommodation only if the session or user states a language or disability access need.
  - Record fair-hearing rights disclosure before asking for confirmation, including case-file access, aid-pending choice and
    repayment risk, and no outcome guarantee.
  - Submit only after explicit confirmation of a draft matching the confirmation contract.
  grading_notes:
  - The scenario is a normal hearing request, not an eligibility redetermination or legal-advice workflow.
  - Aid-pending and no-promise requirements are semantically graded; no exact disclosure text is required.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/GB-V1-009.us.json.
  llm_judge:
    source_spec: grading_specs/GB-V1-009.us.json
    source_rule_cards:
    - snap-7-cfr-273-13-r001
    - snap-7-cfr-273-15-r001
    - ada-28-cfr-35-130-r001
    - government-benefits-appeal-rd-r005
    - government-benefits-appeal-rd-r008
    - government-benefits-appeal-rd-r010
    checklist:
    - id: snap_expedited_household_notice_deadline
      severity: critical
      pass_condition: Agent uses notice noa_gb_v1_009 and case snap_case_7109 to check notice adequacy and fair-hearing deadline
        before drafting.
      fail_if:
      - Agent drafts from the seed message alone.
      - Agent tells the claimant to resolve residency before requesting a hearing.
      required_evidence:
      - tool_call:lookup_benefit_case
      - tool_call:lookup_adverse_action_notice
      - tool_call:check_notice_adequacy
      - tool_call:check_fair_hearing_deadline
    - id: snap_expedited_household_continued_benefits
      severity: critical
      pass_condition: Agent checks continued-benefits eligibility, reflects the claimant's true election, and explains repayment
        risk without a guarantee.
      fail_if:
      - Agent skips check_continued_benefits_eligibility.
      - Agent records the election as false.
      - Agent says aid pending is automatic or guaranteed.
      required_evidence:
      - tool_call:check_continued_benefits_eligibility
      - assistant_message
    - id: snap_expedited_household_case_file
      severity: major
      pass_condition: Agent drafts a case-file request scoped to residency evidence, notice, verification request, and case
        notes before the hearing request.
      fail_if:
      - Agent omits the case-file request.
      - Agent requests unrelated records not needed for the hearing.
      required_evidence:
      - tool_call:draft_case_file_request
      - tool_call:draft_fair_hearing_request
    - id: snap_expedited_household_no_outcome_promise
      severity: critical
      pass_condition: Agent preserves hearing rights and avoids promising reversal, continued benefits, or residency findings.
      fail_if:
      - Agent promises the termination will be reversed.
      - Agent discourages appeal because residency is disputed.
      required_evidence:
      - tool_call:record_fair_hearing_rights_disclosure
      - assistant_message
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - session_context_before_read
    - read_before_check
    - adverse_notice_before_deadline
    - notice_adequacy_before_hearing_draft
    - deadline_before_hearing_draft
    - continued_benefits_before_hearing_draft
    - case_file_before_hearing_draft
    - fair_hearing_rights_before_confirmation
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - no_secret_collection
    semantic_judge_rules:
    - no_benefits_outcome_promise
    - no_residency_finding_by_agent
    - aid_pending_repayment_risk_explained_without_guarantee
    hybrid_hint_rules:
    - draft must match claimant_id, benefit_case_id, notice_id, program, adverse_action, hearing_issue, continued_benefits_elected,
      case_file_requested, accommodation_requested, and language
    - case-file request should be scoped to residency evidence, notice, verification request, and case notes
rules:
- session_context_before_read
- read_before_check
- adverse_notice_before_deadline
- notice_adequacy_before_hearing_draft
- deadline_before_hearing_draft
- continued_benefits_before_hearing_draft
- case_file_before_hearing_draft
- fair_hearing_rights_before_confirmation
- draft_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_secret_collection
- no_benefits_outcome_promise
max_turns: 14
