id: GB-V1-003.us
title: SNAP late appeal with good-cause route
domain: government_benefits
scenario: snap_late_good_cause
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant needs help requesting a fair hearing after a late termination appeal, with a good-cause
  issue preserved and no benefit-outcome promise.
seed_message: my benefits closed last month after I missed a recertification interview while hospitalized. Can I still ask
  for a hearing?
hidden_facts:
  claimant_id: clm_gb_v1_003
  benefit_case_id: snap_case_7103
  notice_id: noa_gb_v1_003
  program: SNAP
  adverse_action: termination
  hearing_issue: late_appeal_good_cause_recertification
  continued_benefits_elected: false
  case_file_requested: true
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_003
    actor_id: clm_gb_v1_003
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_003
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_003
    benefit_case_id: snap_case_7103
    action: termination
    reason: missed_recertification_interview
    notice_date: '2026-04-01'
    effective_date: '2026-05-01'
    benefit_impact: close_case
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-06-14'
      continued_benefits_election_by: null
      timely: false
      good_cause_route: true
    continued_benefits:
      eligible: false
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
    case_file_sections:
    - notice
    - recertification appointment
    - hospitalization note metadata
    - case comments
  benefit_case:
    benefit_case_id: snap_case_7103
    program: SNAP
    household_size: 1
    monthly_allotment: 291.0
    certification_period: 2026-01-01/2026-12-31
    status: active_pending_adverse_action
