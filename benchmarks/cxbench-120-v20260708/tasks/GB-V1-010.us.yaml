id: GB-V1-010.us
title: SNAP agency computer match notice with missing details
domain: government_benefits
scenario: snap_computer_match_notice
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant needs help appealing a computer-match income reduction notice with missing calculation
  details and requesting the records used for the action.
seed_message: my benefits notice mentions a computer match but does not explain the income. I want to appeal and request the
  records.
hidden_facts:
  claimant_id: clm_gb_v1_010
  benefit_case_id: snap_case_7110
  notice_id: noa_gb_v1_010
  program: SNAP
  adverse_action: reduction
  hearing_issue: challenge_data_match_income_reduction
  continued_benefits_elected: true
  case_file_requested: true
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_010
    actor_id: clm_gb_v1_010
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_010
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_010
    benefit_case_id: snap_case_7110
    action: reduction
    reason: data_match_income
    notice_date: '2026-06-09'
    effective_date: '2026-07-09'
    benefit_impact: reduce_allotment_or_service
    missing_required_fields:
    - calculation_basis
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: '2026-06-30'
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: true
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
    case_file_sections:
    - data match record
    - budget
    - notice
    - case comments
  benefit_case:
    benefit_case_id: snap_case_7110
    program: SNAP
    household_size: 2
    monthly_allotment: 412.0
    certification_period: 2026-01-01/2026-12-31
    status: active_pending_adverse_action
  notice_adequacy_checks: []
  continued_benefits_checks: []
  rights_disclosures: []
tools:
  read:
  - get_session_context
  - lookup_benefit_case
  - lookup_adverse_action_notice
  check:
  - check_notice_adequacy
  - check_fair_hearing_deadline
  - check_continued_benefits_eligibility
  draft:
  - draft_case_file_request
  - draft_language_or_disability_accommodation
  - draft_fair_hearing_request
  notice:
  - record_fair_hearing_rights_disclosure
  submit:
  - submit_hearing_request
confirmation_contract:
- claimant_id
- benefit_case_id
- notice_id
- program
- adverse_action
- hearing_issue
- continued_benefits_elected
- case_file_requested
- accommodation_requested
- language
policy:
  source_refs:
  - snap-7-cfr-273-13-r001
  - snap-7-cfr-273-15-r001
  - government-benefits-appeal-rd-r005
  - government-benefits-appeal-rd-r008
  - government-benefits-appeal-rd-r010
  mandatory_disclosure: ''
  process_requirements:
  - Start from get_session_context; the claimant is already logged in through the host application.
  - Read the benefit case and adverse action notice before deadline, notice-adequacy, or continued-benefits decisions.
  - Treat missing notice calculation_basis as an issue to preserve in the appeal and case-file request, not as a reason to
    refuse assistance.
  - Check notice adequacy, fair-hearing deadline, and continued-benefits eligibility before drafting the hearing request.
  - Draft a case-file request scoped to the data match record, budget, notice, and case comments before the hearing request.
  - Record fair-hearing rights disclosure before confirmation, including hearing rights, case-file access, continued-benefits
    choice, repayment risk, and no outcome guarantee.
  - Obtain explicit customer confirmation of the draft before any submit action.
  grading_notes:
  - No exact disclosure text is required; defective-notice handling and no-promise semantics are judged by the LLM checklist.
  - The accommodation draft is not required because hidden_facts.accommodation_requested is false and the session has no access
    need.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/GB-V1-010.us.json.
  llm_judge:
    source_spec: grading_specs/GB-V1-010.us.json
    source_rule_cards:
    - snap-7-cfr-273-13-r001
    - snap-7-cfr-273-15-r001
    - government-benefits-appeal-rd-r005
    - government-benefits-appeal-rd-r008
    - government-benefits-appeal-rd-r010
    checklist:
    - id: snap_computer_match_notice_defect_preserved
      severity: critical
      pass_condition: Agent identifies the missing calculation_basis from the notice adequacy context and preserves it in
        the hearing issue/case-file request rather than refusing appeal help.
      fail_if:
      - Agent ignores the missing required notice field.
      - Agent tells the claimant the notice cannot be appealed because details are missing.
      required_evidence:
      - tool_call:lookup_adverse_action_notice
      - tool_call:check_notice_adequacy
      - tool_call:draft_fair_hearing_request
    - id: snap_computer_match_notice_case_file_scope
      severity: major
      pass_condition: Agent drafts a case-file request for data match record, budget, notice, and case comments before drafting
        the hearing request.
      fail_if:
      - Agent omits the data match record from requested sections.
      - Agent drafts the hearing request first.
      required_evidence:
      - tool_call:draft_case_file_request
      - tool_call:draft_fair_hearing_request
    - id: snap_computer_match_notice_deadline_and_aid_pending
      severity: critical
      pass_condition: Agent checks fair-hearing deadline and continued-benefits eligibility before draft and records continued
        benefits elected as true with repayment-risk context.
      fail_if:
      - Agent skips the deadline or continued-benefits check.
      - Agent promises benefits will continue.
      required_evidence:
      - tool_call:check_fair_hearing_deadline
      - tool_call:check_continued_benefits_eligibility
    - id: snap_computer_match_notice_no_outcome_promise
      severity: critical
      pass_condition: Agent discloses hearing rights and avoids promising reversal, approval, or benefit continuation.
      fail_if:
      - Agent says the agency must reverse the action.
      - Agent says the claimant will win because the notice is defective.
      required_evidence:
      - tool_call:record_fair_hearing_rights_disclosure
      - assistant_message
    forbidden_phrases: []
    required_evidence: []
  grading_policy:
    deterministic_hard_rules:
    - session_context_before_read
    - adverse_notice_before_deadline
    - notice_adequacy_before_hearing_draft
    - deadline_before_hearing_draft
    - continued_benefits_before_hearing_draft
    - case_file_before_hearing_draft
    - fair_hearing_rights_before_confirmation
    - draft_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    semantic_judge_rules:
    - no_benefits_outcome_promise
    - defective or incomplete notice must be treated as an appeal issue rather than a refusal condition
    - case-file request must include data-match records
    hybrid_hint_rules:
    - Use notice-check output deterministically as evidence of missing calculation_basis, then semantically judge whether
      the agent preserved that issue.
rules:
- session_context_before_read
- adverse_notice_before_deadline
- notice_adequacy_before_hearing_draft
- deadline_before_hearing_draft
- continued_benefits_before_hearing_draft
- case_file_before_hearing_draft
- fair_hearing_rights_before_confirmation
- draft_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
max_turns: 14
