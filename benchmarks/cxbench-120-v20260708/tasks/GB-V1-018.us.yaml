id: GB-V1-018.us
title: SNAP shelter deduction cut with no aid pending requested
domain: government_benefits
scenario: snap_no_aid_pending_requested
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant needs help appealing a shelter deduction reduction while explicitly declining continued
  benefits and requesting case-file access.
seed_message: 'Here’s a compliant rephrase:


  “my benefits benefits are going down because my rent deduction was lowered. I want a hearing, but I do not want my benefits
  to stay at the current level while the appeal is pending.”'
hidden_facts:
  claimant_id: clm_gb_v1_018
  benefit_case_id: snap_case_7118
  notice_id: noa_gb_v1_018
  program: SNAP
  adverse_action: reduction
  hearing_issue: contest_shelter_cost_reduction
  continued_benefits_elected: false
  case_file_requested: true
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_018
    actor_id: clm_gb_v1_018
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_018
    preferred_language: en
    access_need: none
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_018
    benefit_case_id: snap_case_7118
    action: reduction
    reason: shelter_cost_change
    notice_date: '2026-06-11'
    effective_date: '2026-07-11'
    benefit_impact: reduce_allotment_or_service
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: '2026-06-30'
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: false
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
    case_file_sections:
    - lease
    - shelter deduction budget
    - notice
    - case comments
  benefit_case:
    benefit_case_id: snap_case_7118
    program: SNAP
    household_size: 2
    monthly_allotment: 459.0
    certification_period: 2026-01-01/2026-12-31
