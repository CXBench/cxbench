id: GB-V1-006.us
title: Spanish-speaking SNAP claimant requests interpreter
domain: government_benefits
scenario: snap_lep_spanish
business_system: government_benefits_appeal_v0
customer_goal: Logged-in SNAP claimant needs help appealing a reduction and requesting Spanish interpretation and translated
  hearing notices while preserving hearing rights, case-file access, aid-pending boundaries, and no outcome promise.
seed_message: Recibi una carta que reduce mis beneficios de my benefits. Necesito apelar y quiero un interprete en espanol.
