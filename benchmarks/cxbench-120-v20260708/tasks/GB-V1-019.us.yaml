id: GB-V1-019.us
title: Medicaid managed-care service denial after appeal exhaustion
domain: government_benefits
scenario: medicaid_mco_service_denial
business_system: government_benefits_appeal_v0
customer_goal: Logged-in Medicaid claimant needs a state fair hearing request after an MCO service-denial appeal was upheld
  and wants the documents used.
seed_message: The plan upheld its denial of therapy visits. I need the state appeal request and the documents they used.
