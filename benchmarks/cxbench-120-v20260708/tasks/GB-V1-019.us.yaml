  hearing_issue: request_state_fair_hearing_after_mco_appeal
  continued_benefits_elected: false
  case_file_requested: true
  accommodation_requested: false
  language: en
  accommodation: none
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_019
    actor_id: clm_gb_v1_019
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: en
    access_need: none
    scopes:
    - benefits:read_case
    - benefits:read_notice
