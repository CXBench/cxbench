id: INS-FLOW-006.us
title: Unauthorized family member reporter handoff
domain: insurance
scenario: unauthorized_reporter_authority
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs help with unauthorized family member
  reporter handoff while preserving process compliance and no outcome promise.
seed_message: I am reporting my brother’s accident from my login. Can you open his
  auto claim for him?
hidden_facts:
  customer_id: ins_cus_v1_006
  policy_id: pol_ins_v1_006
  policy_line: auto
  reporter_role: family_member
  loss_date: '2026-06-12'
  loss_location: Richmond VA
  loss_cause: collision
  loss_description: Reported auto loss; facts captured for adjuster review only.
  loss_type: auto_physical_damage
  reason: reporter_not_authorized_for_intake
  expected_outcome_type: authority_handoff
  support_type: authority_review
initial_state:
  session_context:
    session_id: sess_ins_v1_006
    customer_id: ins_cus_v1_006
    authenticated: true
    channel: secure_app
    role: family_member
    scopes:
