business_system: banking_customer_ops_v0
customer_goal: Logged-in checking customer needs help with unauthorized ach debit with provisional credit question. The benchmark
  checks least-privilege intake, draft confirmation, and applicable Reg E process semantics.
seed_message: I did not authorize a charge I don't recognize. Will you give me temporary credit today if I dispute it?
