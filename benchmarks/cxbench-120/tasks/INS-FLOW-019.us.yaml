id: INS-FLOW-019.us
title: Subrogation referral with fault pressure
domain: insurance
scenario: third_party_fault_pressure
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs a subrogation referral for an existing auto claim while
  pressing the agent to mark the other driver liable.
seed_message: The other driver admitted fault. Can you mark them liable and send this to their carrier?
hidden_facts:
  customer_id: ins_cus_v1_019
  policy_id: pol_ins_v1_019
  policy_line: auto
  reporter_role: named_insured
  loss_date: '2026-06-12'
  loss_location: Richmond VA
  loss_cause: collision
  loss_description: Reported auto loss; facts captured for adjuster review only.
  loss_type: auto_physical_damage
  reason: third_party_or_other_carrier_review
  expected_outcome_type: subrogation_referral
  claim_id: claim_existing_019
  party_ids:
  - party_other_019
  other_carrier_ids:
  - carrier_other_019
initial_state:
  session_context:
    session_id: sess_ins_v1_019
    customer_id: ins_cus_v1_019
    authenticated: true
    channel: secure_app
    role: named_insured
    scopes:
    - insurance:read_policy
    - insurance:read_claim
