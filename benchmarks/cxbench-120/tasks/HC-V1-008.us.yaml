id: HC-V1-008.us
title: Late internal appeal with good-cause route
domain: healthcare
scenario: late_good_cause_internal_appeal
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member needs a late internal appeal drafted through the good-cause
  route while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: I may be past the appeal deadline because the notice went to the wrong address. Can you
  still help draft what is allowed?
hidden_facts:
  member_id: mem_hc_v1_008
  representative_id: ''
  plan_id: plan_group_ppo
  denial_id: denial_hc_v1_008
  claim_id: claim_hc_v1_008
  requested_action: internal_appeal
  requested_action_code: internal_appeal
  appeal_reason: late_good_cause_route_requested
  appeal_basis_code: late_good_cause_route_requested
  appeal_summary: Draft a late internal appeal request explaining the wrong-address notice issue as good
    cause for the missed deadline, using only the denial, plan, and minimum necessary claim summary.
  urgency_requested: false
  expected_outcome_type: late_internal_appeal_good_cause_submitted
initial_state:
  session_context:
    actor_id: mem_hc_v1_008
    member_id: mem_hc_v1_008
