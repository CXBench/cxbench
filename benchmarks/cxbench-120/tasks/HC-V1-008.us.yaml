    service_date: '2026-05-09'
    service_code: OBS-ROOM
    denial_reason: late_notice_wrong_address
    review_type: post_service
    deadline_date: '2026-05-15'
    within_deadline: false
    late_good_cause_route: true
    urgent_care: false
    continuity_of_care: false
