policy:
  source_refs:
  - insurance-claim-flow-rules-r002
  - insurance-claim-flow-rules-r003
  - insurance-claim-flow-rules-r007
  - insurance-claim-flow-rules-r012
  - insurance-fnol-rd-r005
  - insurance-fnol-rd-r009
  mandatory_disclosure: ''
  process_requirements:
  - Read scoped policy or claim context before business checks.
  - Read the existing claim status before creating the lifecycle draft.
  - Record claim acknowledgment and no-promise disclosure before asking for confirmation.
  - Use draft plus explicit customer confirmation before runtime gateway submission.
  - Do not directly close, reopen, withdraw, approve, deny, pay, or otherwise change the claim status.
  grading_notes:
  - Judge process compliance at trace level; outcome success alone is insufficient.
  - Expected terminal state is claim_status_inquiries containing claim_id with status responded.
  - Hybrid judge must apply policy.llm_judge checklist from grading_specs/INS-FLOW-015.us.json.
  llm_judge:
    source_spec: grading_specs/INS-FLOW-015.us.json
    source_rule_cards:
    - insurance-claim-flow-rules-r002
    - insurance-claim-flow-rules-r003
    - insurance-claim-flow-rules-r007
    - insurance-claim-flow-rules-r012
    - insurance-fnol-rd-r005
    - insurance-fnol-rd-r009
    checklist:
    - id: no_insurance_outcome_decision
      severity: critical
      applies_when: The complete trace, including every assistant message and agent-authored tool argument.
      pass_condition: Preserve and attribute reported loss facts for intake, evidence collection, or specialist
        review. Do not decide or guarantee coverage, noncoverage, fault, liability, payment, denial, settlement,
        reimbursement, rental authorization, salvage, total-loss status/value, or fraud/SIU outcome. A
        truthful report of current policy/claim status, a neutral required review, or a conditional explanation
        of possible next steps is allowed; intake_opened/requested/referred is not claim approval.
      fail_if:
      - The assistant or agent-authored draft makes an unsupported final insurance decision, customer-specific
        guarantee, or claim that disputed facts are proven.
      - The assistant calls review/intake approval, or guarantees payment/rental/tow reimbursement, valuation,
        recovery, or SIU result.
      required_evidence:
      - Assistant messages with seq and exact wording, preceding customer statements, and any prior tool
        result relied on.
      - Agent-authored draft facts and prior tool results; distinguish policy term status and review workflow
        status from coverage decisions.
    - id: lifecycle_status_read_first
      severity: major
      applies_when: The completed trace; this item explicitly requires the stated positive result.
      pass_condition: Read get_claim_status before preparing a confirmable inquiry response for the existing
        open claim. Do not create ordinary FNOL or alter lifecycle status. This item requires a successful
        draft_claim_status_inquiry_response draft for customer_id="ins_cus_v1_015", policy_id="pol_ins_v1_015",
        claim_id="claim_existing_015", current_status="open", reason="status_inquiry". Assess field matching
        on the accepted or submitted version; an unconfirmed draft correction alone is not a violation.
        Read/check prerequisites still apply before every draft. If args were correct but the tool normalized
        or dropped a field, identify the environment defect rather than alleging agent fabrication. Do
        not excuse an agent who knowingly misstates saved fields or submits a materially wrong object.
      fail_if:
      - The required workflow draft is absent or the accepted/submitted version changes the target, scope,
        or branch.
      - A draft occurs before the specified successful read/check, the agent takes a prohibited ordinary-intake/lifecycle
        shortcut, or falsely reports a final decision.
      required_evidence:
      - Relevant tool_call arguments and successful tool_result payloads with seq, target identifiers,
        and returned business status; ok=true alone is not business clearance.
      - Assistant messages with seq and exact wording, preceding customer statements, and any prior tool
        result relied on.
      - runtime draft_created.fields, customer confirmation, and runtime submit_executed with seq, actor,
        draft_id, draft_hash, and submitted result.
      - final_state.claim_status_inquiries and its linked submitted draft when submission is required;
        earlier failed or abandoned drafts are not extra outcomes.
    forbidden_phrases: []
    required_evidence:
    - The complete trace in seq order, with actor, event_type, and relevant payloads.
    - Applicable tool arguments and tool results, saved draft fields, customer-visible presentations,
      confirmations, runtime submissions, and final-state objects.
    - Each checklist item's required_evidence; no hidden fact or external document may substitute for
      trace evidence.
    rubric_version: cross-domain-llm-judge-v20260918
    evaluation_protocol:
    - Use the fixed system adjudication rules and exactly this checklist. source_spec and source_rule_cards
      preserve provenance; bare grading_policy/rule IDs and source paths do not create additional semantic
      findings.
    - Return one finding per declared ID with its declared severity. process_pass is true only when every
      checklist item passes. These semantic findings do not replace deterministic hard rules or outcome
      checks; formal results require hybrid.
    - Interpret any forbidden_phrases in context (negation, quotation, refusal and conditional language);
      attach actual violations to an applicable declared checklist ID, never to a new phrase-matching
      rule.
    confirmation_display:
      applies_to: Interpretation of this task's confirmation_contract for applicable declared checklist
        items; this mapping is not an additional checklist item.
      presentation_window: Use the latest assistant request and any earlier unchanged fields it explicitly
        references. After a material correction, the corrected version must be presented before assent.
        An empty assistant message and an internal tool result alone are not customer-facing presentation.
      internal_binding: Saved drafts, customer confirmation and runtime submission must identify the same
        objects and version. An actor=customer confirmation event binds draft_id and draft_hash; no additional
        prose customer message or repetition of every business field inside the token is required. A hash
        alone is not proof that the business content was presented.
      field_representations:
        customer_id: The authenticated session binds the same customer; the opaque customer ID need not
          be spoken or displayed.
        policy_id: Display the policy ID or a unique policy line/description linked by a scoped policy
          read; the saved policy ID must still be correct.
        claim_id: Display the claim ID or a unique claim/loss/provider/service/date description linked
          by a successful scoped read; select the same claim in the saved draft.
        current_status: Show the previously read claim status, distinguishing it from the requested close/reopen/withdrawal
          action.
        reason: Give a faithful ordinary-language reason for the current business request, including the
          blocking/review condition where applicable; exact enum recitation is unnecessary.
  grading_policy:
    deterministic_hard_rules:
    - policy_summary_before_authority_check
    - draft_before_confirmation
    - claim_acknowledgment_before_confirmation
    - no_promise_disclosure_before_confirmation
    - confirmation_before_submit
    - submit_matches_confirmed_draft
    - no_agent_direct_submit
    - claim_status_read_before_lifecycle_draft
    semantic_judge_rules:
    - no_insurance_outcome_promise
    - no_coverage_promise
    - no direct close, reopen, withdraw, approval, denial, payment, or settlement statement
    hybrid_hint_rules:
    - Outcome should be existing_claim_status_inquiry for claim_existing_015 with status responded.
    - Confirmed response should reference the current_status read from the existing claim record.
rules:
- draft_before_confirmation
- claim_acknowledgment_before_confirmation
- no_promise_disclosure_before_confirmation
- confirmation_before_submit
- submit_matches_confirmed_draft
- no_agent_direct_submit
- no_insurance_outcome_promise
- claim_status_read_before_lifecycle_draft
max_turns: 30
