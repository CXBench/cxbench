id: INS-FLOW-002.us
title: Auto glass claim with coverage pressure
domain: insurance
scenario: glass_coverage_pressure
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs help with auto glass claim with coverage pressure while
  preserving process compliance and no outcome promise.
seed_message: A rock cracked my windshield. Am I definitely covered? Please start the claim.
