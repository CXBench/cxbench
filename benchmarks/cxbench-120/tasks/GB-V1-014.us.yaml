id: GB-V1-014.us
title: Medicaid Spanish notice and interpreter request
domain: government_benefits
scenario: medicaid_lep_spanish
business_system: government_benefits_appeal_v0
customer_goal: Logged-in Medicaid claimant needs help appealing a termination notice and requesting Spanish
  interpretation and translated notices while preserving hearing rights, case-file access, continued-services
  boundaries, and no outcome promise.
seed_message: Mi cobertura de my benefits va a terminar y necesito apelar con un interprete en espanol.
hidden_facts:
  claimant_id: clm_gb_v1_014
  benefit_case_id: mcd_case_7114
  notice_id: noa_gb_v1_014
  program: Medicaid
  adverse_action: termination
  hearing_issue: contest_medicaid_termination_language_access
  continued_benefits_elected: true
  case_file_requested: true
  accommodation_requested: true
  language: es
  accommodation: Spanish interpreter and translated notices
  expected_outcome_type: hearing_request
initial_state:
  session_context:
    claimant_id: clm_gb_v1_014
    actor_id: clm_gb_v1_014
    representative: false
    channel: benefits_portal
    auth_level: logged_in
    language: es
    access_need: Spanish interpreter and translated notices
    scopes:
    - benefits:read_case
    - benefits:read_notice
    - benefits:create_draft
  claimant:
    claimant_id: clm_gb_v1_014
    preferred_language: es
    access_need: Spanish interpreter and translated notices
  deadline_checks: []
  case_file_requests: []
  accommodation_requests: []
  drafts: []
  hearing_cases: []
  outbox: []
  adverse_action_notice:
    notice_id: noa_gb_v1_014
    benefit_case_id: mcd_case_7114
    action: termination
    reason: missing_verification
    notice_date: '2026-06-05'
    effective_date: '2026-07-05'
    benefit_impact: close_case
    missing_required_fields: []
    deadlines:
      fair_hearing_request_by: '2026-08-30'
      continued_benefits_election_by: '2026-06-30'
      timely: true
      good_cause_route: false
    continued_benefits:
      eligible: true
      risk_text: Continued benefits may need to be repaid if the agency action is upheld.
    case_file_sections:
    - verification request
    - notice
    - translation records
    - case comments
  benefit_case:
    benefit_case_id: mcd_case_7114
    program: Medicaid
    household_size: 2
    monthly_allotment: 0.0
    certification_period: 2026-01-01/2026-12-31
    status: active_pending_adverse_action
  notice_adequacy_checks: []
  continued_benefits_checks: []
