id: HC-V1-003.us
title: Urgent medication denial expedited appeal
domain: healthcare
scenario: urgent_medication_denial
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs urgent medication denial expedited
  appeal while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: My medication request was denied, and my prescriber says any delay could seriously affect
  my health. Please help me file an urgent appeal.
hidden_facts:
  member_id: mem_hc_v1_003
  representative_id: ''
  plan_id: plan_aca_silver
  denial_id: denial_hc_v1_003
  claim_id: claim_hc_v1_003
  requested_action: expedited_internal_appeal
  appeal_reason: urgent_care_prescriber_support_needed
  urgency_requested: true
  expected_outcome_type: expedited_internal_appeal_submitted
initial_state:
  business_system: healthcare_appeal_v0
  jurisdiction: us_aca_hipaa
  session_context:
    actor_id: mem_hc_v1_003
    member_id: mem_hc_v1_003
    role: member
    channel: member_portal
    auth_level: logged_in_strong_customer_auth
    scopes:
