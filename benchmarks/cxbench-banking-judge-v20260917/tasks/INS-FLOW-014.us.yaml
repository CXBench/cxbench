id: INS-FLOW-014.us
title: Reopen closed claim request
domain: insurance
scenario: reopen_closed_claim
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs help with reopen closed claim request while preserving
  process compliance and no outcome promise.
seed_message: My closed claim has new damage we missed. Can you reopen it?
