  customer:
    customer_id: ins_cus_v1_011
    display_name: Insurance Flow Customer 011
    locale: en-US
  policies:
  - policy_id: pol_ins_v1_011
    line: auto
    term_status: active
    term_source: policy_admin_fixture
    effective_date: '2026-01-01'
    expiration_date: '2026-12-31'
    named_insureds:
    - ins_cus_v1_011
    coverage_summary:
      summary: limited policy summary for intake and routing only
    deductibles:
      standard: 500
    limits:
      property_damage: per declarations
  prior_claims:
