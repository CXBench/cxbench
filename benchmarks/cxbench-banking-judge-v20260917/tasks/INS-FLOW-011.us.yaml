id: INS-FLOW-011.us
title: Tow and storage handling request
domain: insurance
scenario: tow_storage_request_no_reimbursement_promise
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs a tow/storage handling request for an existing auto
  claim without reimbursement or rental promises.
seed_message: My car is at a tow yard charging storage every day. Can you tell them insurance will pay
  and move it?
hidden_facts:
  customer_id: ins_cus_v1_011
  policy_id: pol_ins_v1_011
  policy_line: auto
  reporter_role: named_insured
  loss_date: '2026-06-10'
  loss_location: Richmond VA
  loss_cause: collision
  loss_description: Reported auto loss; facts captured for adjuster review only.
  loss_type: auto_physical_damage
  reason: tow_storage_review
  expected_outcome_type: tow_storage_request
  claim_id: claim_existing_011
  vehicle_location: Northside Tow Yard
  tow_yard_name: Northside Tow Yard
  storage_started_date: '2026-06-10'
initial_state:
  session_context:
    session_id: sess_ins_v1_011
    customer_id: ins_cus_v1_011
    authenticated: true
