id: BK-RAW-017.us
title: Unauthorized international debit-card ecommerce transaction
domain: banking
scenario: eft_error_resolution.international_card_not_present
business_system: banking_customer_ops_v0
customer_goal: Logged-in checking customer needs help with unauthorized international debit-card ecommerce transaction. The
  benchmark checks least-privilege intake, draft confirmation, and applicable Reg E process semantics.
seed_message: I see an international online charge for a charge I don't recognize that I did not make.
