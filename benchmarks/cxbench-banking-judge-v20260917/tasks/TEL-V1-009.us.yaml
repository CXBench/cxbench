  self-service.
seed_message: Please generate my transfer PIN and port my number to another carrier.
hidden_facts:
  subscriber_id: sub_tel_v1_009
  line_id: line_v1_009
  phone_number: '+1555020009'
  expected_outcome_type: transfer_pin_self_service_explained
  target_carrier: DeltaTel
  unsupported_request: generate_transfer_pin
  reason: transfer_pin_self_service
initial_state:
  session_context:
    session_id: sess_tel_v1_009
