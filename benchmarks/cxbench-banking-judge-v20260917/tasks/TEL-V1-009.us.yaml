    device_trust: trusted
  subscriber:
    subscriber_id: sub_tel_v1_009
    display_name: Telecom V1 Customer 009
    account_tier: consumer
  lines:
  - line_id: line_v1_009
    phone_number: '+1555020009'
    phone_number_masked: '****0009'
    status: active
    device_name: iPhone
    sim_type: physical_sim
    sim_iccid_masked: '****2009'
