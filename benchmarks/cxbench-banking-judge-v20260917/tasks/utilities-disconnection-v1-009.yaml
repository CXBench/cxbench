id: UTL-V1-009.us-ca
title: FERA low-income extended payment plan
domain: utilities
scenario: fera_low_income_extended_plan
business_system: utilities_disconnection_v0
customer_goal: Logged-in California residential utility customer needs help with fera low-income extended
  payment plan.
seed_message: A household enrolled in a low-income assistance program received a gas shutoff notice for
  an overdue balance and needs a realistic payment arrangement.
