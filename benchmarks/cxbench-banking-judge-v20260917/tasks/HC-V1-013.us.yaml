id: HC-V1-013.us
title: External review for experimental treatment final denial
domain: healthcare
scenario: external_review_experimental
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs external review for experimental treatment
  final denial while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: "Here\u2019s a rephrased request you can use:\n\nI am requesting an independent third-party\
  \ review of the final denial for my treatment. The denial states the treatment is experimental, but\
  \ I believe the service is medically necessary and should be reconsidered based on the clinical facts\
  \ and my provider\u2019s recommendation.\n\nIf you want, I can also turn this into:\n1. a formal appeal\
  \ letter,\n2. a shorter member statement, or\n3. a fill-in-the-blank template with placeholders for\
  \ plan details and dates."
hidden_facts:
  member_id: mem_hc_v1_013
  representative_id: ''
  plan_id: plan_aca_gold
  denial_id: denial_hc_v1_013
  claim_id: claim_hc_v1_013
  requested_action: external_review_request
  appeal_reason: external_review_experimental_denial
  urgency_requested: false
  expected_outcome_type: external_review_request_submitted
