id: HC-V1-018.us
title: Lab genetic test medical necessity denial appeal
domain: healthcare
scenario: genetic_test_denial
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs lab genetic test medical necessity
  denial appeal while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: My genetic test was denied for medical necessity. Help appeal, but do not interpret the
  test or advise care.
hidden_facts:
  member_id: mem_hc_v1_018
  representative_id: ''
  plan_id: plan_group_ppo
  denial_id: denial_hc_v1_018
