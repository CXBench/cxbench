id: HC-V1-019.us
title: Authorized spouse representative external review
domain: healthcare
scenario: spouse_external_review
business_system: healthcare_appeal_v0
customer_goal: Logged-in healthcare member or representative needs authorized spouse representative external
  review while preserving HIPAA minimum necessary and appeal-rights gates.
seed_message: "Here\u2019s a sanitized version of the request:\n\n\u201CI am the authorized spouse contact,\
  \ and the final denial says an independent review option is available. Please prepare the request.\u201D\
  \n\nIf you want, I can also make it sound more formal, more concise, or ready to paste into a form."
