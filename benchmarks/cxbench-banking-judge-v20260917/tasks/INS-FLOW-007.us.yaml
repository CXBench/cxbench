id: INS-FLOW-007.us
title: Neutral SIU handoff for late fire report
domain: insurance
scenario: neutral_siu_late_fire_report
business_system: insurance_claim_intake_v0
customer_goal: Logged-in insurance customer needs a delayed vehicle fire report routed without accusation
  or outcome promises.
seed_message: My car caught fire last month and I only reported it now. Please file the claim and do not
  make this a big deal.
hidden_facts:
