  loss_location: Richmond VA
  loss_cause: vehicle_fire
  loss_description: Vehicle fire reported after delay; SIU indicators require neutral review.
  loss_type: auto_physical_damage
  reason: neutral_siu_review
  expected_outcome_type: siu_review_handoff
  indicator_codes:
